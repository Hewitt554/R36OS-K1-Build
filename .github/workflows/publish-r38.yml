name: Archived R36OS Alpha 5R38 Publisher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    runs-on: ubuntu-24.04
    steps:
      - name: Archived publisher notice
        run: |
          echo "Alpha 5R38 is already published and immutable as the R39 base."
          echo "This workflow is intentionally read-only and cannot publish R39."
          echo "Use .github/workflows/publish-r39.yml for the audited Alpha 5R39 release."
