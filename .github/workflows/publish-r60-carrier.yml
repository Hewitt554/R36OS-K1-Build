name: Publish R36OS Alpha 5R60 via verified carrier

on:
  push:
    branches:
      - work/r60-checkpointed-k1-baseline-fixes-2026-10-01
    paths:
      - '.github/workflows/publish-r60-carrier.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REPO: Hewitt554/R36OS-K1-Build
      VALIDATION_RUN: '36834055522'
      VALIDATION_ARTIFACT_ID: '11148393451'
      VALIDATED_HEAD_SHA: 2e7fdb56dcb43ba0f5976c0b7ff0158b883a08b4
      PREPUBLISH_MAIN_SHA: 40f82f43d36299d988381ae189d07f516c120530
      CARRIER_TAG: alpha5r48
      NAME: 00-R36OS-Alpha5R60-K1WiFiGraphicsLab-FromR59.r36upd
      EXPECTED_SHA: 0f17ef90423984f163a5a25a306c9bee346c24a958c921b03a1bda3ba01c05c2
      EXPECTED_SIZE: '24880'
      EXPECTED_CID: 9d7bd2334f315d98b482f850
      KREL: 6.12.94-r36os-k1

    steps:
      - uses: actions/checkout@v4

      - name: Prove exact validation lineage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN="$(gh api "repos/$REPO/actions/runs/$VALIDATION_RUN")"
          test "$(printf '%s' "$RUN" | jq -r .status)" = completed
          test "$(printf '%s' "$RUN" | jq -r .conclusion)" = success
          test "$(printf '%s' "$RUN" | jq -r .head_sha)" = "$VALIDATED_HEAD_SHA"

          ART="$(gh api "repos/$REPO/actions/artifacts/$VALIDATION_ARTIFACT_ID")"
          test "$(printf '%s' "$ART" | jq -r .name)" = R36OS-Alpha5R60-audited-validation-candidate
          test "$(printf '%s' "$ART" | jq -r .expired)" = false
          echo R60_VALIDATION_LINEAGE=PASS

      - name: Download exact validated R60 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/actions/artifacts/$VALIDATION_ARTIFACT_ID/zip" >candidate.zip
          mkdir candidate
          unzip -q candidate.zip -d candidate

          PKG="$(find candidate -type f -name "$NAME" -print)"
          SHA_FILE="$(find candidate -type f -name "$NAME.sha256" -print)"
          LATEST="$(find candidate -type f -name latest.conf -print)"
          REPORT="$(find candidate -type f -name RELEASE_REPORT.txt -print)"
          for v in PKG SHA_FILE LATEST REPORT; do
            p="${!v}"
            test -n "$p" && test -f "$p"
            echo "$v=$p" >>"$GITHUB_ENV"
          done

          test "$(stat -c %s "$PKG")" = "$EXPECTED_SIZE"
          test "$(sha256sum "$PKG" | awk '{print $1}')" = "$EXPECTED_SHA"
          grep -Fxq "$EXPECTED_SHA  $NAME" "$SHA_FILE"

          grep -Fxq 'version=0.5.60.0' "$REPORT"
          grep -Fxq 'base_version=0.5.59.0' "$REPORT"
          grep -Fxq "candidate_id=$EXPECTED_CID" "$REPORT"
          grep -Fxq "kernel_release=$KREL" "$REPORT"
          grep -Fxq 'k1_binary_change=no' "$REPORT"
          grep -Fxq 'candidate_id_change=no' "$REPORT"
          grep -Fxq 'k1_image_change=no' "$REPORT"
          grep -Fxq 'k1_dtb_change=no' "$REPORT"
          grep -Fxq 'k1_uinitrd_change=no' "$REPORT"
          grep -Fxq 'module_payload_change=no' "$REPORT"
          grep -Fxq 'legacy_kernel_change=no' "$REPORT"
          grep -Fxq 'native_ui_change=no' "$REPORT"
          grep -Fxq 'wifi_runtime_bind_fix=yes' "$REPORT"
          grep -Fxq 'wifi_direct_module_fallback=yes' "$REPORT"
          grep -Fxq 'wifi_networkmanager_activation=yes' "$REPORT"
          grep -Fxq 'graphics_lab_k1_noinput=yes' "$REPORT"

          rm -rf pkg
          mkdir pkg
          tar -xzf "$PKG" -C pkg
          (cd pkg && sha256sum -c checksums.sha256 >/dev/null)

          test "$(awk -F= '$1=="version"{print $2}' pkg/manifest.conf)" = 0.5.60.0
          test "$(awk -F= '$1=="base_version"{print $2}' pkg/manifest.conf)" = 0.5.59.0
          test "$(awk -F= '$1=="candidate_id"{print $2}' pkg/manifest.conf)" = "$EXPECTED_CID"
          test "$(awk -F= '$1=="kernel_release"{print $2}' pkg/manifest.conf)" = "$KREL"
          test "$(awk -F= '$1=="k1_binary_change"{print $2}' pkg/manifest.conf)" = no
          test "$(awk -F= '$1=="module_payload_change"{print $2}' pkg/manifest.conf)" = no
          test "$(awk -F= '$1=="wifi_runtime_bind_fix"{print $2}' pkg/manifest.conf)" = yes
          test "$(awk -F= '$1=="graphics_lab_k1_noinput"{print $2}' pkg/manifest.conf)" = yes

          ROOT=pkg/payload/root
          test -s "$ROOT/usr/local/bin/r36os-k1-wifi-bind"
          test -s "$ROOT/usr/local/bin/r36os-graphics-test-session"
          test ! -e "$ROOT/boot"
          test ! -e "$ROOT/lib/modules"
          test ! -e "$ROOT/usr/lib/modules"
          test ! -e "$ROOT/opt/r36os/kernel-next/K1"
          test ! -e "$ROOT/opt/r36os/kernel-next/hook.conf"
          test ! -e "$ROOT/opt/r36os/kernel-next/hooked-boot.ini"
          test ! -e "$ROOT/usr/local/bin/r36os-alpha5"
          echo R60_VALIDATED_ARTIFACT=PASS

      - name: Upload exact R60 files to carrier release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$CARRIER_TAG" --repo "$REPO" >/dev/null
          cp "$REPORT" /tmp/R60_RELEASE_REPORT.txt

          ensure_asset() {
            local file="$1" name="$2"
            local rel id
            rel="$(gh api "repos/$REPO/releases/tags/$CARRIER_TAG")"
            id="$(printf '%s' "$rel" | jq -r --arg n "$name" '.assets[] | select(.name==$n) | .id' | head -1)"
            if [ -n "$id" ] && [ "$id" != null ]; then
              gh api -H 'Accept: application/octet-stream' "repos/$REPO/releases/assets/$id" >"/tmp/existing-$name"
              cmp "$file" "/tmp/existing-$name"
              echo "existing verified asset: $name"
            else
              gh release upload "$CARRIER_TAG" "$file" --repo "$REPO"
              echo "uploaded asset: $name"
            fi
          }

          ensure_asset "$PKG" "$NAME"
          ensure_asset "$SHA_FILE" "$NAME.sha256"
          ensure_asset /tmp/R60_RELEASE_REPORT.txt R60_RELEASE_REPORT.txt
          echo R60_CARRIER_UPLOAD=PASS

      - name: Verify carrier asset bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REL="$(gh api "repos/$REPO/releases/tags/$CARRIER_TAG")"
          ASSET_ID="$(printf '%s' "$REL" | jq -r --arg n "$NAME" '.assets[] | select(.name==$n) | .id')"
          SIZE="$(printf '%s' "$REL" | jq -r --arg n "$NAME" '.assets[] | select(.name==$n) | .size')"
          test -n "$ASSET_ID" && test "$ASSET_ID" != null
          test "$SIZE" = "$EXPECTED_SIZE"
          gh api -H 'Accept: application/octet-stream' "repos/$REPO/releases/assets/$ASSET_ID" >/tmp/r60.r36upd
          test "$(stat -c %s /tmp/r60.r36upd)" = "$EXPECTED_SIZE"
          test "$(sha256sum /tmp/r60.r36upd | awk '{print $1}')" = "$EXPECTED_SHA"
          echo R60_CARRIER_ASSET_VERIFY=PASS

      - name: Advance live channel R59 to R60
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$PREPUBLISH_MAIN_SHA"
          git checkout -B publish-r60-main origin/main
          cp "$LATEST" /tmp/r60-latest.conf

          grep -Fxq 'format=R36OS_REMOTE_UPDATE_V1' /tmp/r60-latest.conf
          grep -Fxq 'version=0.5.60.0' /tmp/r60-latest.conf
          grep -Fxq 'base_version=0.5.59.0' /tmp/r60-latest.conf
          grep -Fxq "filename=$NAME" /tmp/r60-latest.conf
          grep -Fxq "size_bytes=$EXPECTED_SIZE" /tmp/r60-latest.conf
          grep -Fxq "sha256=$EXPECTED_SHA" /tmp/r60-latest.conf
          grep -Fxq "candidate_id=$EXPECTED_CID" /tmp/r60-latest.conf
          grep -Fxq "kernel_release=$KREL" /tmp/r60-latest.conf
          grep -Fxq "url=https://github.com/$REPO/releases/download/$CARRIER_TAG/$NAME" /tmp/r60-latest.conf

          cp /tmp/r60-latest.conf r36os-release-channel/latest.conf
          git config user.name 'R36OS Release Bot'
          git config user.email 'r36os-release-bot@users.noreply.github.com'
          git add r36os-release-channel/latest.conf
          git diff --cached --check
          git commit -m 'Publish Alpha 5R60 update channel via verified carrier asset'
          CHANNEL_COMMIT="$(git rev-parse HEAD)"
          echo "CHANNEL_COMMIT=$CHANNEL_COMMIT" >>"$GITHUB_ENV"
          git push origin HEAD:main
          echo R60_CHANNEL_ADVANCE=PASS

      - name: Verify live channel and preserve postpublish backup
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$CHANNEL_COMMIT"
          git show "$CHANNEL_COMMIT:r36os-release-channel/latest.conf" >/tmp/live.conf
          cmp /tmp/live.conf /tmp/r60-latest.conf
          git push origin "$CHANNEL_COMMIT:refs/heads/backup/r60-postpublish-verified-2026-10-01"
          echo R60_PUBLISH=PASS
