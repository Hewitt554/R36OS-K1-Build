name: Validate Native C03 developer delivery

on:
  push:
    branches:
      - work/native-c03-dev-delivery-2026-10-01
    paths:
      - 'native-r36os/c03-delivery/**'
      - '.github/workflows/native-c03-delivery.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REPO: Hewitt554/R36OS-K1-Build
      TAG: alpha5r48
      R60_NAME: 00-R36OS-Alpha5R60-K1WiFiGraphicsLab-FromR59.r36upd
      R60_SHA: 0f17ef90423984f163a5a25a306c9bee346c24a958c921b03a1bda3ba01c05c2
      C03_RUN: '36886819015'
      C03_ARTIFACT: '11175525608'
      C03_HEAD: e0eafefcab9c00de271790ae503a20fe700a74cc
      R58_SOURCE_COMMIT: 9e9458e53c8f72198cb3d6ee4ec1e0630ba221bc
      NAME: 00-R36OS-Alpha5R60-C03Dev1-FromR60.r36upd

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Static delivery source gate
        run: |
          set -euo pipefail
          bash -n native-r36os/c03-delivery/build_delivery.sh
          bash -n native-r36os/c03-delivery/r36os-native-c03-control
          python3 -m py_compile \
            native-r36os/c03-delivery/transform_ui_c03dev.py \
            native-r36os/c03-delivery/transform_r60_dev.py

          grep -Fq 'Arm Native Boot Once' native-r36os/c03-delivery/transform_ui_c03dev.py
          grep -Fq 'native_c03_confirm=1' native-r36os/c03-delivery/transform_ui_c03dev.py
          grep -Fq 'stage-only' native-r36os/c03-delivery/r36os-native-c03-control
          grep -Fq 'arm-once' native-r36os/c03-delivery/r36os-native-c03-control
          grep -Fq 'disarm' native-r36os/c03-delivery/r36os-native-c03-control

          ! grep -Eq '(^|[;&|[:space:]])(reboot|poweroff|shutdown)([;&|[:space:]]|$)' \
            native-r36os/c03-delivery/r36os-native-c03-control
          ! grep -Eq 'ExecStart=.*arm-once|WantedBy=.*native|boot-native.*once' \
            native-r36os/c03-delivery/r36os-native-c03-control
          echo C03DEV_SOURCE_GATE=PASS

      - name: Install build/audit tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld file unzip

      - name: Prove exact C03 validation lineage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN="$(gh api "repos/$REPO/actions/runs/$C03_RUN")"
          test "$(printf '%s' "$RUN" | jq -r .status)" = completed
          test "$(printf '%s' "$RUN" | jq -r .conclusion)" = success
          test "$(printf '%s' "$RUN" | jq -r .head_sha)" = "$C03_HEAD"
          ART="$(gh api "repos/$REPO/actions/artifacts/$C03_ARTIFACT")"
          test "$(printf '%s' "$ART" | jq -r .name)" = R36OS-Native-C03-bootonce-candidate
          test "$(printf '%s' "$ART" | jq -r .expired)" = false
          echo C03DEV_LINEAGE=PASS

      - name: Download exact R60 and C03 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs/c03
          gh release download "$TAG" --repo "$REPO" --pattern "$R60_NAME" --dir inputs
          test "$(sha256sum "inputs/$R60_NAME" | awk '{print $1}')" = "$R60_SHA"

          gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/actions/artifacts/$C03_ARTIFACT/zip" >inputs/c03.zip
          unzip -q inputs/c03.zip -d inputs/c03
          test -s inputs/c03/c03-a/bundle/MANIFEST.sha256
          (cd inputs/c03/c03-a/bundle && sha256sum -c MANIFEST.sha256 >/dev/null)
          test "$(sha256sum inputs/c03/c03-a/bundle/rootfs.tar.zst | awk '{print $1}')" = 08214b18d833b8abed0ab86c0140774a0759f075e4d8ea454d85567590b53ec4
          test "$(sha256sum inputs/c03/c03-a/bundle/uInitrd | awk '{print $1}')" = be567cd71bc95c35cfdaf7100ee0846517df5cd78538e4f3da6157a7fa61d694
          echo C03DEV_INPUTS=PASS

      - name: Reconstruct exact R58/R60 UI source
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$R58_SOURCE_COMMIT"
          mkdir -p inputs/r58
          for n in 00 01 02 03 04; do
            git show FETCH_HEAD:r58-release/source/r36os_alpha5.c.gz.b64.part$n >>inputs/r58/base.c.gz.b64
          done
          base64 -d inputs/r58/base.c.gz.b64 >inputs/r58/base.c.gz
          gzip -dc inputs/r58/base.c.gz >inputs/r58/base.c
          git show FETCH_HEAD:r58-release/transform_ui.py >inputs/r58/transform_ui.py

          test "$(sha256sum inputs/r58/base.c | awk '{print $1}')" = 25e2de1b49b31033176e45f9106d4509d715c31371ac2dee1b95e6edbb6c71bd
          python3 inputs/r58/transform_ui.py inputs/r58/base.c inputs/r58/r58.c
          test "$(sha256sum inputs/r58/r58.c | awk '{print $1}')" = 657803bb2b4f60414d85775f86dae8d01d3cb46d631cfe2309e682dffd93289a
          echo C03DEV_UI_SOURCE=PASS

      - name: Build developer delivery twice
        run: |
          set -euo pipefail
          chmod +x native-r36os/c03-delivery/build_delivery.sh
          ./native-r36os/c03-delivery/build_delivery.sh \
            "$PWD/inputs/$R60_NAME" \
            "$PWD/inputs/c03/c03-a/bundle" \
            "$PWD/inputs/r58/r58.c" \
            "$PWD/out-a" | tee build-a.log

          ./native-r36os/c03-delivery/build_delivery.sh \
            "$PWD/inputs/$R60_NAME" \
            "$PWD/inputs/c03/c03-a/bundle" \
            "$PWD/inputs/r58/r58.c" \
            "$PWD/out-b" | tee build-b.log

      - name: Deterministic package and safety audit
        run: |
          set -euo pipefail
          A="out-a/$NAME"
          B="out-b/$NAME"
          cmp "$A" "$B"
          diff -u out-a/C03DEV_DELIVERY_REPORT.txt out-b/C03DEV_DELIVERY_REPORT.txt
          SHA="$(sha256sum "$A" | awk '{print $1}')"
          SIZE="$(stat -c %s "$A")"
          echo "DELIVERY_SHA=$SHA" >>"$GITHUB_ENV"
          echo "DELIVERY_SIZE=$SIZE" >>"$GITHUB_ENV"

          rm -rf audit
          mkdir audit
          tar -xzf "$A" -C audit
          (cd audit && sha256sum -c checksums.sha256 >/dev/null)

          test "$(awk -F= '$1=="version"{print $2}' audit/manifest.conf)" = 0.5.60.1
          test "$(awk -F= '$1=="base_version"{print $2}' audit/manifest.conf)" = 0.5.60.0
          test "$(awk -F= '$1=="developer_only"{print $2}' audit/manifest.conf)" = yes
          test "$(awk -F= '$1=="public_channel_change"{print $2}' audit/manifest.conf)" = no
          test "$(awk -F= '$1=="auto_stage"{print $2}' audit/manifest.conf)" = no
          test "$(awk -F= '$1=="auto_arm"{print $2}' audit/manifest.conf)" = no
          test "$(awk -F= '$1=="auto_boot"{print $2}' audit/manifest.conf)" = no
          test "$(awk -F= '$1=="legacy_kernel_change"{print $2}' audit/manifest.conf)" = no
          test "$(awk -F= '$1=="k1_image_change"{print $2}' audit/manifest.conf)" = no
          test "$(awk -F= '$1=="k1_dtb_change"{print $2}' audit/manifest.conf)" = no
          test "$(awk -F= '$1=="k1_modules_change"{print $2}' audit/manifest.conf)" = no

          ROOT=audit/payload/root
          test -s "$ROOT/usr/local/bin/r36os-alpha5"
          test -x "$ROOT/usr/local/bin/r36os-native-c03-control"
          test -s "$ROOT/opt/r36os/native-next/C03/rootfs.tar.zst"
          test "$(sha256sum "$ROOT/opt/r36os/native-next/C03/rootfs.tar.zst" | awk '{print $1}')" = 08214b18d833b8abed0ab86c0140774a0759f075e4d8ea454d85567590b53ec4
          test "$(sha256sum "$ROOT/opt/r36os/native-next/C03/uInitrd" | awk '{print $1}')" = be567cd71bc95c35cfdaf7100ee0846517df5cd78538e4f3da6157a7fa61d694

          grep -Fxq 'EXPECTED_VERSION=0.5.60.1' "$ROOT/opt/r36os/native-next/C03/r36os-native-c03-prepare"
          ! grep -Fq 'EXPECTED_VERSION=0.5.60.0' "$ROOT/opt/r36os/native-next/C03/r36os-native-c03-prepare"
          (cd "$ROOT/opt/r36os/native-next/C03" && sha256sum -c MANIFEST.sha256 >/dev/null)

          file "$ROOT/usr/local/bin/r36os-alpha5" | grep -Eq 'ARM aarch64|ARM64'
          file "$ROOT/usr/local/bin/r36os-alpha5" | grep -Fq 'statically linked'
          strings "$ROOT/usr/local/bin/r36os-alpha5" | grep -Fq 'Native C03 developer controls'
          strings "$ROOT/usr/local/bin/r36os-alpha5" | grep -Fq 'Arm Native Boot Once'
          strings "$ROOT/usr/local/bin/r36os-alpha5" | grep -Fq 'K1 split input: gpio-keys event'

          test "$(find "$ROOT" -type l -print -quit)" = ""
          test ! -e "$ROOT/boot"
          test ! -e "$ROOT/lib/modules"
          test ! -e "$ROOT/usr/lib/modules"

          test "$(printf '0.5.60.0\n0.5.60.1\n' | sort -V | tail -1)" = 0.5.60.1

          # There must be no startup unit/script that calls stage-only or arm-once.
          ! grep -RIlE 'ExecStart=.*(stage-only|arm-once)|WantedBy=.*native' "$ROOT/etc/systemd" 2>/dev/null | grep -q .
          ! find "$ROOT" -path '*/boot-native.*.once' -o -name 'R36N3.CNS' | grep -q .

          grep -Fxq 'public_channel_change=no' out-a/C03DEV_DELIVERY_REPORT.txt
          grep -Fxq 'auto_stage=no' out-a/C03DEV_DELIVERY_REPORT.txt
          grep -Fxq 'auto_arm=no' out-a/C03DEV_DELIVERY_REPORT.txt
          grep -Fxq 'auto_boot=no' out-a/C03DEV_DELIVERY_REPORT.txt
          echo "C03DEV_PACKAGE_AUDIT=PASS sha256=$SHA size=$SIZE"

      - name: Upload exact private developer update
        uses: actions/upload-artifact@v4
        with:
          name: R36OS-Alpha5R60-C03Dev1-private-update
          path: |
            out-a/00-R36OS-Alpha5R60-C03Dev1-FromR60.r36upd
            out-a/00-R36OS-Alpha5R60-C03Dev1-FromR60.r36upd.sha256
            out-a/C03DEV_DELIVERY_REPORT.txt
            build-a.log
            build-b.log
          if-no-files-found: error
          retention-days: 30
