name: R43 FAT checker audit lab

on:
  push:
    branches:
      - work/r43-clean-rebuild-2026-09-28
    paths:
      - 'R43_FULL_AUDIT.md'
      - '.github/workflows/r43-fsck-audit-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-fsck:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dosfstools qemu-user-static binutils-aarch64-linux-gnu file

      - name: Download exact R40 checker and pinned source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs old
          gh release download alpha5r40 --repo Hewitt554/R36OS-K1-Build --pattern '00-R36OS-Alpha5R40-LogsAndFATRepair-FromR39.r36upd' --dir inputs
          gh release download alpha5r40 --repo Hewitt554/R36OS-K1-Build --pattern 'dosfstools-4.2.tar.gz' --dir inputs
          echo '448c056d9b1eac99443d0fad1ff10be9c9b40c7a8ffc4be33015c52d44ecd1e2  inputs/00-R36OS-Alpha5R40-LogsAndFATRepair-FromR39.r36upd' | sha256sum -c -
          echo '64926eebf90092dca21b14259a5301b7b98e7b1943e8a201c7d726084809b527  inputs/dosfstools-4.2.tar.gz' | sha256sum -c -
          tar -xOzf inputs/00-R36OS-Alpha5R40-LogsAndFATRepair-FromR39.r36upd payload/root/usr/local/libexec/r36os/fsck.fat-static > old/fsck.fat-static
          chmod 0755 old/fsck.fat-static
          echo 'fe165b0784dd3c301cdf422691b1e5630bd5fab11bca15b8419906b10900d665  old/fsck.fat-static' | sha256sum -c -

      - name: Build replacement checker twice in Ubuntu 20.04
        run: |
          set -euo pipefail
          for n in a b; do
            rm -rf "build-$n"
            mkdir -p "build-$n"
            docker run --rm -v "$PWD:/work" -w /work ubuntu:20.04 bash -lc "
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update >/dev/null
              apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu autoconf automake autopoint gettext pkg-config make >/dev/null
              mkdir -p /tmp/src-$n
              tar -xzf /work/inputs/dosfstools-4.2.tar.gz -C /tmp/src-$n --strip-components=1
              cd /tmp/src-$n
              ./configure --host=aarch64-linux-gnu --without-iconv CC=aarch64-linux-gnu-gcc CFLAGS='-O2 -fno-plt' LDFLAGS='-static' >/tmp/config-$n.log
              make -j2 src/fsck.fat >/tmp/make-$n.log
              cp src/fsck.fat /work/build-$n/fsck.fat-static
              chmod 0755 /work/build-$n/fsck.fat-static
            "
          done
          cmp build-a/fsck.fat-static build-b/fsck.fat-static
          sha256sum build-a/fsck.fat-static | tee build-a/SHA256.txt
          file build-a/fsck.fat-static | tee build-a/file.txt
          grep -q 'ARM aarch64' build-a/file.txt
          grep -q 'statically linked' build-a/file.txt
          if aarch64-linux-gnu-readelf -d build-a/fsck.fat-static 2>/dev/null | grep -q NEEDED; then
            echo 'dynamic dependency found' >&2
            exit 20
          fi
          if strings build-a/fsck.fat-static | grep -q 'iconv_init_codepage'; then
            echo 'iconv code unexpectedly present' >&2
            exit 21
          fi

      - name: Create clean and dirty FAT32 fixtures
        run: |
          set -euo pipefail
          truncate -s 64M clean.img
          mkfs.fat -F 32 -n R36UPDATE -i 1234ABCD clean.img >/dev/null
          mkdir -p /tmp/r43mnt
          LOOP="$(sudo losetup --find --show clean.img)"
          sudo mount -t vfat "$LOOP" /tmp/r43mnt
          printf 'R36OS-R43-CONTENT-CHECK\n' | sudo tee /tmp/r43mnt/content.txt >/dev/null
          sudo mkdir -p /tmp/r43mnt/nested
          printf 'nested-content\n' | sudo tee /tmp/r43mnt/nested/file.txt >/dev/null
          sync
          sudo umount /tmp/r43mnt
          sudo losetup -d "$LOOP"
          cp clean.img dirty.img
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path("dirty.img")
          b=bytearray(p.read_bytes())
          sector_size=struct.unpack_from("<H",b,11)[0]
          reserved=struct.unpack_from("<H",b,14)[0]
          fats=b[16]
          fat_len=struct.unpack_from("<I",b,36)[0]
          assert sector_size in (512,1024,2048,4096)
          assert reserved > 0 and fats >= 1 and fat_len > 0
          b[65] |= 0x01
          fat0=reserved*sector_size
          entry1=struct.unpack_from("<I",b,fat0+4)[0]
          entry1 &= ~0x08000000
          struct.pack_into("<I",b,fat0+4,entry1)
          if fats > 1:
              fat1=fat0+fat_len*sector_size
              e=struct.unpack_from("<I",b,fat1+4)[0] & ~0x08000000
              struct.pack_into("<I",b,fat1+4,e)
          p.write_bytes(b)
          PY

      - name: Characterize old R40 checker
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp dirty.img old-v.img
          set +e
          LC_ALL=C LANG=C /usr/bin/qemu-aarch64-static old/fsck.fat-static -a -V old-v.img >evidence/old-aV.txt 2>&1
          echo "$?" > evidence/old-aV.rc
          cp dirty.img old-a.img
          LC_ALL=C LANG=C /usr/bin/qemu-aarch64-static old/fsck.fat-static -a old-a.img >evidence/old-a.txt 2>&1
          echo "$?" > evidence/old-a.rc
          set -e
          printf 'old_aV_rc=%s\nold_a_rc=%s\n' "$(cat evidence/old-aV.rc)" "$(cat evidence/old-a.rc)" | tee evidence/old-summary.txt

      - name: Execute replacement checker on actual FAT images
        run: |
          set -euo pipefail
          NEW=build-a/fsck.fat-static
          LC_ALL=C LANG=C /usr/bin/qemu-aarch64-static "$NEW" --help >evidence/new-help.txt 2>&1
          grep -q 'Check FAT filesystem' evidence/new-help.txt
          LC_ALL=C LANG=C /usr/bin/qemu-aarch64-static "$NEW" -n clean.img >evidence/new-clean-n.txt 2>&1
          cp dirty.img repaired.img
          set +e
          LC_ALL=C LANG=C /usr/bin/qemu-aarch64-static "$NEW" -n repaired.img >evidence/new-dirty-precheck.txt 2>&1
          PRE=$?
          set -e
          test "$PRE" -eq 1
          set +e
          LC_ALL=C LANG=C /usr/bin/qemu-aarch64-static "$NEW" -a repaired.img >evidence/new-repair.txt 2>&1
          REPAIR=$?
          set -e
          case "$REPAIR" in 0|1) ;; *) cat evidence/new-repair.txt; exit 22;; esac
          LC_ALL=C LANG=C /usr/bin/qemu-aarch64-static "$NEW" -n repaired.img >evidence/new-verify.txt 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import struct
          b=Path("repaired.img").read_bytes()
          sector_size=struct.unpack_from("<H",b,11)[0]
          reserved=struct.unpack_from("<H",b,14)[0]
          fat0=reserved*sector_size
          entry1=struct.unpack_from("<I",b,fat0+4)[0]
          assert not (b[65] & 1), f"boot dirty bit remains: {b[65]:02x}"
          assert entry1 & 0x08000000, f"FAT32 clean shutdown bit remains clear: {entry1:08x}"
          PY
          printf 'precheck_rc=%s\nrepair_rc=%s\nverify_rc=0\n' "$PRE" "$REPAIR" | tee evidence/new-summary.txt

      - name: Prove file contents survive target repair
        run: |
          set -euo pipefail
          mkdir -p /tmp/r43verify
          LOOP="$(sudo losetup --find --show repaired.img)"
          sudo mount -t vfat -o ro "$LOOP" /tmp/r43verify
          grep -qx 'R36OS-R43-CONTENT-CHECK' /tmp/r43verify/content.txt
          grep -qx 'nested-content' /tmp/r43verify/nested/file.txt
          sudo umount /tmp/r43verify
          sudo losetup -d "$LOOP"
          echo R43_TARGET_CHECKER_LAB=PASS | tee evidence/PASS.txt

      - name: Preserve audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: R43-fat-checker-audit-lab
          path: |
            evidence/
            build-a/fsck.fat-static
            build-a/SHA256.txt
            build-a/file.txt
          if-no-files-found: error
          retention-days: 14
