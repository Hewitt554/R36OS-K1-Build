name: Validate R36OS Alpha 5R52

on:
  push:
    branches:
      - work/r52-visible-k1-boot-trace-2026-09-29
    paths:
      - 'r52-release/**'
      - '.github/workflows/validate-r52.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download exact published lineage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs
          gh release download alpha5r48 --repo Hewitt554/R36OS-K1-Build --pattern '00-R36OS-Alpha5R51-PersistentK1Breadcrumbs-FromR50.r36upd' --dir inputs
          gh release download alpha5r48 --repo Hewitt554/R36OS-K1-Build --pattern '00-R36OS-Alpha5R50-RootConsumedKernelStatus-FromR49.r36upd' --dir inputs
          gh release download alpha5r39 --repo Hewitt554/R36OS-K1-Build --pattern '00-R36OS-Alpha5R39-K1FATRemoteDiagnostics-FromR38.r36upd' --dir inputs
          echo '11e1bdfd6378f96607dbc608412c17fefd729ceef71cb1ed633073b99cfc4f82  inputs/00-R36OS-Alpha5R51-PersistentK1Breadcrumbs-FromR50.r36upd' | sha256sum -c -
          echo '5a41efe1b5019bfb2c8b9166bffd48c663997121e90a8a58f59b1e901f7072f0  inputs/00-R36OS-Alpha5R50-RootConsumedKernelStatus-FromR49.r36upd' | sha256sum -c -
          echo '406aa63aedf893b39fdff16f6131f605d99883aa759286228c1cf607dce74ebd  inputs/00-R36OS-Alpha5R39-K1FATRemoteDiagnostics-FromR38.r36upd' | sha256sum -c -

      - name: Source audit
        run: |
          set -euo pipefail
          bash -n r52-release/build_release.sh
          python3 -m py_compile r52-release/*.py
          grep -Fq '[5/5] Starting Linux 6.12.94-r36os-k1' r52-release/transform_hook.py
          grep -Fq 'console=tty1 loglevel=8 ignore_loglevel earlycon plymouth.enable=0 systemd.show_status=1' r52-release/transform_hook.py
          grep -Fq 'deepest_uboot_stage=' r52-release/transform_health.py
          grep -Fq 'k1-root-breadcrumbs.txt' r52-release/transform_github_diagnostics.py
          echo R52_SOURCE_AUDIT=PASS

      - name: Build R52 twice
        run: |
          set -euo pipefail
          chmod +x r52-release/build_release.sh
          R51="$PWD/inputs/00-R36OS-Alpha5R51-PersistentK1Breadcrumbs-FromR50.r36upd"
          R50="$PWD/inputs/00-R36OS-Alpha5R50-RootConsumedKernelStatus-FromR49.r36upd"
          R39="$PWD/inputs/00-R36OS-Alpha5R39-K1FATRemoteDiagnostics-FromR38.r36upd"
          ./r52-release/build_release.sh "$R51" "$R50" "$R39" "$PWD/out-a" | tee r52-build-a.log
          ./r52-release/build_release.sh "$R51" "$R50" "$R39" "$PWD/out-b" | tee r52-build-b.log

      - name: Audit deterministic package
        run: |
          set -euo pipefail
          A=out-a/00-R36OS-Alpha5R52-VisibleK1BootTrace-FromR51.r36upd
          B=out-b/00-R36OS-Alpha5R52-VisibleK1BootTrace-FromR51.r36upd
          cmp "$A" "$B"
          diff -u out-a/latest.conf out-b/latest.conf
          diff -u out-a/RELEASE_REPORT.txt out-b/RELEASE_REPORT.txt
          rm -rf pkg
          mkdir pkg
          tar -xzf "$A" -C pkg
          (cd pkg && sha256sum -c checksums.sha256 >/dev/null)

          test "$(awk -F= '$1=="version"{print $2}' pkg/manifest.conf)" = 0.5.52.0
          test "$(awk -F= '$1=="base_version"{print $2}' pkg/manifest.conf)" = 0.5.51.0
          test "$(awk -F= '$1=="k1_binary_change"{print $2}' pkg/manifest.conf)" = no
          test "$(awk -F= '$1=="visible_k1_trace"{print $2}' pkg/manifest.conf)" = yes
          test "$(awk -F= '$1=="fallback_breadcrumb_capture"{print $2}' pkg/manifest.conf)" = yes

          HOOK=pkg/payload/root/opt/r36os/kernel-next/hooked-boot.ini
          META=pkg/payload/root/opt/r36os/kernel-next/hook.conf
          for msg in \
            '[1/5] One-shot guard verified' \
            '[2/5] Linux Image loaded' \
            '[3/5] initramfs loaded' \
            '[4/5] Panel-4 DTB loaded' \
            '[5/5] Starting Linux 6.12.94-r36os-k1'; do grep -Fq "$msg" "$HOOK"; done
          grep -Fq 'console=tty1 loglevel=8 ignore_loglevel earlycon plymouth.enable=0 systemd.show_status=1' "$HOOK"
          grep -Fxq 'format=R36OS_K1_BOOT_HOOK_V5' "$META"
          grep -Fxq 'visible_trace=yes' "$META"

          if grep 'fatwrite mmc 1:3' "$HOOK" | sed -n 's/.*"\([^"]*\)".*/\1/p' | grep -q '/'; then
            echo subdirectory-fatwrite-found >&2
            exit 30
          fi

          grep -Fq 'deepest_uboot_stage=' pkg/payload/root/usr/local/bin/r36os-kernel-next-health
          grep -Fq 'k1-root-breadcrumbs.txt' pkg/payload/root/usr/local/bin/r36os-github-diagnostics
          grep -Fq 'kernel-slot-live.txt' pkg/payload/root/usr/local/bin/r36os-github-diagnostics
          grep -Fq 'k1-attempt-status.txt' pkg/payload/root/usr/local/bin/r36os-github-diagnostics

          pkg/payload/root/usr/local/bin/r36os-github-diagnostics selftest | grep -q 'R36OS_GITHUB_DIAGNOSTICS_SELFTEST=PASS'

          test ! -e pkg/payload/root/r36state
          ! find pkg/payload/root -type f | grep -Eq '/(boot/|lib/modules/|usr/lib/modules/)'
          ! find pkg/payload/root -type f | grep -Eq '/opt/r36os/kernel-next/K1/(Image|uInitrd|rk3326-r36s-k1.dtb|modules.tar.xz)$'
          echo R52_PACKAGE_AUDIT=PASS

      - name: Verify cumulative core manifest
        run: |
          set -euo pipefail
          M=pkg/payload/root/etc/r36os-core-manifest.sha256
          for p in \
            /usr/local/bin/r36os-kernel-next-prepare \
            /usr/local/bin/r36os-kernel-slot \
            /usr/local/bin/r36os-r36update-maint \
            /usr/local/bin/r36os-k1-install-hook \
            /usr/local/bin/r36os-kernel-next-health \
            /usr/local/bin/r36os-github-diagnostics \
            /opt/r36os/kernel-next/hooked-boot.ini \
            /opt/r36os/kernel-next/hook.conf; do
            exp="$(awk -v p="$p" '$2==p{print $1}' "$M")"
            got="$(sha256sum "pkg/payload/root$p" | awk '{print $1}')"
            test -n "$exp" && test "$exp" = "$got"
          done
          echo R52_CORE_MANIFEST=PASS

      - name: Upload exact validated R52 candidate
        uses: actions/upload-artifact@v4
        with:
          name: R36OS-Alpha5R52-audited-validation-candidate
          path: |
            out-a/00-R36OS-Alpha5R52-VisibleK1BootTrace-FromR51.r36upd
            out-a/00-R36OS-Alpha5R52-VisibleK1BootTrace-FromR51.r36upd.sha256
            out-a/latest.conf
            out-a/RELEASE_REPORT.txt
            r52-build-a.log
            r52-build-b.log
          if-no-files-found: error
          retention-days: 30
