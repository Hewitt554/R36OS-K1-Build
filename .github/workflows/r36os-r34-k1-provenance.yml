name: R36OS R34 K1 exact source provenance (READ ONLY)

on:
  push:
    paths:
      - ".github/workflows/r36os-r34-k1-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Inspect authoritative CP04 kernel patches and build inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Extract and hash immutable R36OS K1 build kit (never install)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p output
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/Hewitt554/R36OS-K1-Build/89719bd08a8a8b32fb0448b58e0e55df20acd0f4/bootstrap_r36os_k1.sh" -o /tmp/k1_bootstrap.sh
          test "$(git hash-object /tmp/k1_bootstrap.sh)" = 7afd3b5032f78371f687e3bab0a38fc076a6c966
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,re,shutil,zipfile
          src=Path('/tmp/k1_bootstrap.sh').read_text()
          start=src.index("cat <<'R36OS_K1_KIT_BASE64' | base64 -d > \"$KIT_ZIP\"")
          start=src.index('\n',start)+1
          end=src.index('\nR36OS_K1_KIT_BASE64',start)
          payload=base64.b64decode(src[start:end])
          sha=hashlib.sha256(payload).hexdigest()
          assert sha=='96c198d8e82c12c445901dbbee85a47a632a018bbc9dd304229d8e6212fa0eeb',sha
          zip_path=Path('/tmp/r36os_authoritative_k1.zip')
          zip_path.write_bytes(payload)
          dest=Path('/tmp/k1_repo')
          with zipfile.ZipFile(zip_path) as z:
              assert z.testzip() is None
              z.extractall(dest)
          folders=list(dest.iterdir())
          assert len(folders)==1 and folders[0].is_dir()
          kit=folders[0]
          dst=Path('output')
          interesting=[]
          for p in kit.rglob('*'):
              if not p.is_file():continue
              rel=str(p.relative_to(kit))
              try:
                  txt=p.read_text(errors='replace')
              except OSError:continue
              if any(needle in txt for needle in ['ROCKCHIP_CPUINFO','CONFIG_LOCALVERSION','CONFIG_RTL8XXXU','kernelrelease','KERNEL_CONFIG','k1.config.fragment']):
                  matches=[(i,line.strip()) for i,line in enumerate(txt.splitlines(),1) if any(x in line for x in ['ROCKCHIP_CPUINFO','CONFIG_LOCALVERSION','CONFIG_RTL8XXXU','kernelrelease','KERNEL_CONFIG','k1.config.fragment'])]
                  interesting.append({'path':rel,'matching_lines':matches[:80]})
          report={'status':'CP34_PROVENANCE_READ_ONLY','bootstrap_blob_verified':True,'embedded_kit_sha256':sha,'embedded_kit_files':sum(1 for p in kit.rglob('*') if p.is_file()),'interesting':interesting,'kernel_image_shipped':False,'device_kernel_modified':False}
          (dst/'K1_PATCH_PROVENANCE.json').write_text(json.dumps(report,indent=2)+'\n')
          for rel in ['BUILD_K1_CHECKPOINT04.sh','k1_source/SELECTED_PATCHES.md','k1_source/k1.config.fragment']:
              p=kit/rel
              if p.is_file():
                  target=dst/'AUTHORITATIVE'/rel
                  target.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(p,target)
          (dst/'README_NO_INSTALL.txt').write_text('R34 source-provenance report only. Original K1 bootstrap and frozen embedded build kit SHA verified. Does not build or install drivers. Do NOT install R31 candidate into the R36XX.\n')
          print('R34_PROVENANCE=PASS files=',report['embedded_kit_files'],'kernel-config-occurrences=',len(interesting))
          for x in interesting:print(x['path'],x['matching_lines'][:5])
          PY
      - name: Upload R34 source evidence (NO INSTALL)
        uses: actions/upload-artifact@v4
        with:
          name: R36OS-R34-K1-PATCH-PROVENANCE-NO-INSTALL
          path: output/
          if-no-files-found: error
          retention-days: 14
