name: Publish R36OS Alpha 5R52 via verified carrier

on:
  push:
    branches:
      - work/r52-visible-k1-boot-trace-2026-09-29
    paths:
      - '.github/workflows/publish-r50-carrier.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REPO: Hewitt554/R36OS-K1-Build
      VALIDATION_RUN: '36608490977'
      VALIDATION_ARTIFACT_ID: '11052870017'
      VALIDATED_HEAD_SHA: 40459ee631b937ba06efc50f02b334f6fdc609d5
      PREPUBLISH_MAIN_SHA: 0d78069313778d67d661d76d45ccee23ab2ad3c5
      CARRIER_TAG: alpha5r48
      NAME: 00-R36OS-Alpha5R52-VisibleK1BootTrace-FromR51.r36upd
      EXPECTED_SHA: 0ef468b19eddc77a3d8ccb8016238082c4fea23ef0d884135a7f48bd26baf0cb
      EXPECTED_SIZE: '27960'

    steps:
      - uses: actions/checkout@v4

      - name: Prove validation lineage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN="$(gh api "repos/$REPO/actions/runs/$VALIDATION_RUN")"
          test "$(printf '%s' "$RUN" | jq -r .conclusion)" = success
          test "$(printf '%s' "$RUN" | jq -r .head_sha)" = "$VALIDATED_HEAD_SHA"
          ART="$(gh api "repos/$REPO/actions/artifacts/$VALIDATION_ARTIFACT_ID")"
          test "$(printf '%s' "$ART" | jq -r .name)" = R36OS-Alpha5R52-audited-validation-candidate
          test "$(printf '%s' "$ART" | jq -r .expired)" = false

      - name: Download exact validated R52 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/actions/artifacts/$VALIDATION_ARTIFACT_ID/zip" >candidate.zip
          mkdir candidate
          unzip -q candidate.zip -d candidate
          PKG="$(find candidate -type f -name "$NAME" -print)"
          SHA_FILE="$(find candidate -type f -name "$NAME.sha256" -print)"
          LATEST="$(find candidate -type f -name latest.conf -print)"
          REPORT="$(find candidate -type f -name RELEASE_REPORT.txt -print)"
          for v in PKG SHA_FILE LATEST REPORT; do
            p="${!v}"
            test -n "$p" && test -f "$p"
            echo "$v=$p" >>"$GITHUB_ENV"
          done
          test "$(stat -c %s "$PKG")" = "$EXPECTED_SIZE"
          test "$(sha256sum "$PKG" | awk '{print $1}')" = "$EXPECTED_SHA"
          grep -Fxq "$EXPECTED_SHA  $NAME" "$SHA_FILE"
          grep -Fxq 'version=0.5.52.0' "$REPORT"
          grep -Fxq 'base_version=0.5.51.0' "$REPORT"
          grep -Fxq 'k1_binary_change=no' "$REPORT"
          grep -Fxq 'visible_k1_trace=yes' "$REPORT"
          grep -Fxq 'persistent_breadcrumbs=yes' "$REPORT"
          grep -Fxq 'fallback_breadcrumb_capture=yes' "$REPORT"
          grep -Fxq 'diagnostics_breadcrumb_export=yes' "$REPORT"
          grep -Fxq 'initramfs_binary_change=no' "$REPORT"

      - name: Upload exact R52 package to carrier release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$CARRIER_TAG" --repo "$REPO" >/dev/null
          if gh api "repos/$REPO/releases/tags/$CARRIER_TAG" | jq -e --arg n "$NAME" '.assets[] | select(.name==$n)' >/dev/null; then
            echo "R52 asset already exists; verify instead of clobbering"
          else
            cp "$REPORT" /tmp/R52_RELEASE_REPORT.txt
            gh release upload "$CARRIER_TAG" "$PKG" "$SHA_FILE" /tmp/R52_RELEASE_REPORT.txt --repo "$REPO"
          fi

      - name: Verify published asset bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REL="$(gh api "repos/$REPO/releases/tags/$CARRIER_TAG")"
          ASSET_ID="$(printf '%s' "$REL" | jq -r --arg n "$NAME" '.assets[] | select(.name==$n) | .id')"
          SIZE="$(printf '%s' "$REL" | jq -r --arg n "$NAME" '.assets[] | select(.name==$n) | .size')"
          test -n "$ASSET_ID"
          test "$SIZE" = "$EXPECTED_SIZE"
          gh api -H 'Accept: application/octet-stream' "repos/$REPO/releases/assets/$ASSET_ID" >/tmp/r52.r36upd
          test "$(stat -c %s /tmp/r52.r36upd)" = "$EXPECTED_SIZE"
          test "$(sha256sum /tmp/r52.r36upd | awk '{print $1}')" = "$EXPECTED_SHA"
          echo R52_CARRIER_ASSET_VERIFY=PASS

      - name: Advance live channel R51 to R52
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$PREPUBLISH_MAIN_SHA"
          git checkout -B publish-r52-main origin/main
          cp "$LATEST" /tmp/r52-latest.conf
          sed -i 's#/releases/download/alpha5r52/#/releases/download/alpha5r48/#' /tmp/r52-latest.conf
          grep -Fxq 'version=0.5.52.0' /tmp/r52-latest.conf
          grep -Fxq 'base_version=0.5.51.0' /tmp/r52-latest.conf
          grep -Fxq "sha256=$EXPECTED_SHA" /tmp/r52-latest.conf
          grep -Fxq "size_bytes=$EXPECTED_SIZE" /tmp/r52-latest.conf
          grep -Fxq "url=https://github.com/$REPO/releases/download/$CARRIER_TAG/$NAME" /tmp/r52-latest.conf
          cp /tmp/r52-latest.conf r36os-release-channel/latest.conf
          git config user.name 'R36OS Release Bot'
          git config user.email 'r36os-release-bot@users.noreply.github.com'
          git add r36os-release-channel/latest.conf
          git diff --cached --check
          git commit -m 'Publish Alpha 5R52 update channel via verified carrier asset'
          CHANNEL_COMMIT="$(git rev-parse HEAD)"
          echo "CHANNEL_COMMIT=$CHANNEL_COMMIT" >>"$GITHUB_ENV"
          git push origin HEAD:main

      - name: Verify live channel and preserve backup
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$CHANNEL_COMMIT"
          git show "$CHANNEL_COMMIT:r36os-release-channel/latest.conf" >/tmp/live.conf
          cmp /tmp/live.conf /tmp/r52-latest.conf
          git push origin "$CHANNEL_COMMIT:refs/heads/backup/r52-postpublish-verified-2026-09-29"
          echo R52_PUBLISH=PASS
