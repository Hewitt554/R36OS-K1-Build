name: Publish R36OS Alpha 5R54 via verified carrier

on:
  push:
    branches:
      - work/r54-k1-handoff-no-legacy-ui-startup-2026-09-29
    paths:
      - '.github/workflows/publish-r50-carrier.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REPO: Hewitt554/R36OS-K1-Build
      VALIDATION_RUN: '36621164968'
      VALIDATION_ARTIFACT_ID: '11057884302'
      VALIDATED_HEAD_SHA: 7a846bcf332e73d542c85c21a45ecf726a6f20ca
      PREPUBLISH_MAIN_SHA: 349d612563008fcab526d1ed39d63320745e8b2a
      CARRIER_TAG: alpha5r48
      NAME: 00-R36OS-Alpha5R54-K1SystemdHandoff-FromR52.r36upd
      EXPECTED_SHA: ed3b331fe1fb6cb23bf60aa997d2bd1fc6634039f2ec176d93d0dd2561ce166e
      EXPECTED_SIZE: '27405'

    steps:
      - uses: actions/checkout@v4

      - name: Prove validation lineage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN="$(gh api "repos/$REPO/actions/runs/$VALIDATION_RUN")"
          test "$(printf '%s' "$RUN" | jq -r .conclusion)" = success
          test "$(printf '%s' "$RUN" | jq -r .head_sha)" = "$VALIDATED_HEAD_SHA"
          ART="$(gh api "repos/$REPO/actions/artifacts/$VALIDATION_ARTIFACT_ID")"
          test "$(printf '%s' "$ART" | jq -r .name)" = R36OS-Alpha5R54-audited-validation-candidate
          test "$(printf '%s' "$ART" | jq -r .expired)" = false

      - name: Download exact validated R54 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/actions/artifacts/$VALIDATION_ARTIFACT_ID/zip" >candidate.zip
          mkdir candidate
          unzip -q candidate.zip -d candidate
          PKG="$(find candidate -type f -name "$NAME" -print)"
          SHA_FILE="$(find candidate -type f -name "$NAME.sha256" -print)"
          LATEST="$(find candidate -type f -name latest.conf -print)"
          REPORT="$(find candidate -type f -name RELEASE_REPORT.txt -print)"
          for v in PKG SHA_FILE LATEST REPORT; do
            p="${!v}"
            test -n "$p" && test -f "$p"
            echo "$v=$p" >>"$GITHUB_ENV"
          done
          test "$(stat -c %s "$PKG")" = "$EXPECTED_SIZE"
          test "$(sha256sum "$PKG" | awk '{print $1}')" = "$EXPECTED_SHA"
          grep -Fxq "$EXPECTED_SHA  $NAME" "$SHA_FILE"
          grep -Fxq 'version=0.5.54.0' "$REPORT"
          grep -Fxq 'base_version=0.5.52.0' "$REPORT"
          grep -Fxq 'old_candidate_id=e551eb6598d6da7a8e8320e9' "$REPORT"
          grep -Fxq 'candidate_id=4c70486f70ba16acf7437403' "$REPORT"
          grep -Fxq 'k1_image_change=no' "$REPORT"
          grep -Fxq 'k1_dtb_change=no' "$REPORT"
          grep -Fxq 'k1_modules_change=no' "$REPORT"
          grep -Fxq 'k1_uinitrd_change=yes' "$REPORT"
          grep -Fxq 'systemd_handoff_wrapper=/opt/r36i' "$REPORT"
          grep -Fxq 'legacy_ui_startup_change=no' "$REPORT"

      - name: Upload exact R54 package to carrier release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$CARRIER_TAG" --repo "$REPO" >/dev/null
          if gh api "repos/$REPO/releases/tags/$CARRIER_TAG" | jq -e --arg n "$NAME" '.assets[] | select(.name==$n)' >/dev/null; then
            echo "R54 asset already exists; verify instead of clobbering"
          else
            cp "$REPORT" /tmp/R54_RELEASE_REPORT.txt
            gh release upload "$CARRIER_TAG" "$PKG" "$SHA_FILE" /tmp/R54_RELEASE_REPORT.txt --repo "$REPO"
          fi

      - name: Verify published asset bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REL="$(gh api "repos/$REPO/releases/tags/$CARRIER_TAG")"
          ASSET_ID="$(printf '%s' "$REL" | jq -r --arg n "$NAME" '.assets[] | select(.name==$n) | .id')"
          SIZE="$(printf '%s' "$REL" | jq -r --arg n "$NAME" '.assets[] | select(.name==$n) | .size')"
          test -n "$ASSET_ID"
          test "$SIZE" = "$EXPECTED_SIZE"
          gh api -H 'Accept: application/octet-stream' "repos/$REPO/releases/assets/$ASSET_ID" >/tmp/r54.r36upd
          test "$(stat -c %s /tmp/r54.r36upd)" = "$EXPECTED_SIZE"
          test "$(sha256sum /tmp/r54.r36upd | awk '{print $1}')" = "$EXPECTED_SHA"
          echo R54_CARRIER_ASSET_VERIFY=PASS

      - name: Advance live channel R52 to R54
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$PREPUBLISH_MAIN_SHA"
          git checkout -B publish-r54-main origin/main
          cp "$LATEST" /tmp/r54-latest.conf
          sed -i 's#/releases/download/alpha5r54/#/releases/download/alpha5r48/#' /tmp/r54-latest.conf
          grep -Fxq 'version=0.5.54.0' /tmp/r54-latest.conf
          grep -Fxq 'base_version=0.5.52.0' /tmp/r54-latest.conf
          grep -Fxq "sha256=$EXPECTED_SHA" /tmp/r54-latest.conf
          grep -Fxq "size_bytes=$EXPECTED_SIZE" /tmp/r54-latest.conf
          grep -Fxq "url=https://github.com/$REPO/releases/download/$CARRIER_TAG/$NAME" /tmp/r54-latest.conf
          cp /tmp/r54-latest.conf r36os-release-channel/latest.conf
          git config user.name 'R36OS Release Bot'
          git config user.email 'r36os-release-bot@users.noreply.github.com'
          git add r36os-release-channel/latest.conf
          git diff --cached --check
          git commit -m 'Publish Alpha 5R54 update channel via verified carrier asset'
          CHANNEL_COMMIT="$(git rev-parse HEAD)"
          echo "CHANNEL_COMMIT=$CHANNEL_COMMIT" >>"$GITHUB_ENV"
          git push origin HEAD:main

      - name: Verify live channel and preserve backup
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$CHANNEL_COMMIT"
          git show "$CHANNEL_COMMIT:r36os-release-channel/latest.conf" >/tmp/live.conf
          cmp /tmp/live.conf /tmp/r54-latest.conf
          git push origin "$CHANNEL_COMMIT:refs/heads/backup/r54-postpublish-verified-2026-09-29"
          echo R54_PUBLISH=PASS
