name: Stage R43 release builder

on:
  push:
    branches:
      - work/r43-source-staging-2026-09-28
    paths:
      - '.github/workflows/stage-r43-builder.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Write audited release builder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r43-release
          cat > r43-release/build_release.sh <<'EOF_BUILDER'
          #!/usr/bin/env bash
          set -euo pipefail

          HERE="$(cd "$(dirname "$0")" && pwd)"
          R41="${1:?exact audited Alpha5R41 .r36upd required}"
          FSCKDIR="${2:?fsck output dir required}"
          FIXDIR="${3:?fixture output dir required}"
          OUT="${4:?output dir required}"

          REPO='Hewitt554/R36OS-K1-Build'
          TAG='alpha5r43'
          NAME='00-R36OS-Alpha5R43-FATRepairAudit-FromR42.r36upd'
          EXPECTED_R41='ac3e350a7332ee3da4624952a15cfdc83cb04c767038e0c0d1015a078a237567'
          EXPECTED_R42_CORE_MANIFEST='c15ab3d6da735f1a9db034a3a2c12b2150afb7a07defd9d888ccbfb63c95c898'
          EXPECTED_R42_EXPORT='ef3330f91db693f8278952b67453fe096e70b48bcbce07d029681ff90894cd40'
          EXPECTED_R42_PREPARE='0336d0f6d389641ddd4305a4d3f87ea85702fdeb5b750815397369e5160d3815'
          EXPECTED_R42_SLOT='8ac6a7ec87d218c468fc1b4330ba61ad786eb6a728a5da7425b06379ce487805'
          CID='e551eb6598d6da7a8e8320e9'
          KREL='6.12.94-r36os-k1'
          WORK="${RUNNER_TEMP:-/tmp}/r36os-r43-release"

          rm -rf "$WORK" "$OUT"
          mkdir -p "$WORK/base" "$WORK/r42" \
            "$WORK/update/payload/root/etc/r36os" \
            "$WORK/update/payload/root/usr/local/bin" \
            "$WORK/update/payload/root/usr/local/libexec/r36os" \
            "$WORK/update/payload/root/opt/r36os/features" "$OUT"

          [[ "$(sha256sum "$R41" | awk '{print $1}')" == "$EXPECTED_R41" ]] || { echo r41-sha-mismatch >&2; exit 10; }
          tar -xzf "$R41" -C "$WORK/base"
          (cd "$WORK/base" && sha256sum -c checksums.sha256 >/dev/null)
          [[ "$(awk -F= '$1=="version"{print $2}' "$WORK/base/manifest.conf")" == '0.5.41.0' ]] || { echo r41-version-mismatch >&2; exit 11; }
          [[ "$(awk -F= '$1=="base_version"{print $2}' "$WORK/base/manifest.conf")" == '0.5.40.0' ]] || { echo r41-base-mismatch >&2; exit 12; }

          # Reconstruct the exact non-secret R42 runtime delta from the audited R41 package.
          python3 - "$WORK/base/payload/root/usr/local/bin/r36os-kernel-next-prepare" "$WORK/r42/r36os-kernel-next-prepare" <<'PY'
          from pathlib import Path
          import sys
          s=Path(sys.argv[1]).read_text()
          if s.count('0.5.41.0') != 1: raise SystemExit('unexpected R41 prepare identity')
          s=s.replace('0.5.41.0','0.5.42.0')
          Path(sys.argv[2]).write_text(s)
          PY
          python3 - "$WORK/base/payload/root/usr/local/bin/r36os-kernel-slot" "$WORK/r42/r36os-kernel-slot" <<'PY'
          from pathlib import Path
          import sys
          s=Path(sys.argv[1]).read_text()
          checks={'0.5.41.0':1,'Alpha 5R41':1,'r41-runtime-lock':1}
          for n,c in checks.items():
              if s.count(n)!=c: raise SystemExit(f'unexpected R41 slot identity: {n}')
          s=s.replace('0.5.41.0','0.5.42.0').replace('Alpha 5R41','Alpha 5R42').replace('r41-runtime-lock','r42-runtime-lock')
          Path(sys.argv[2]).write_text(s)
          PY
          cp "$HERE/r36os-export-current-logs" "$WORK/r42/r36os-export-current-logs"
          chmod 0755 "$WORK/r42"/r36os-*
          [[ "$(sha256sum "$WORK/r42/r36os-export-current-logs" | awk '{print $1}')" == "$EXPECTED_R42_EXPORT" ]] || { echo r42-export-reconstruction-mismatch >&2; exit 13; }
          [[ "$(sha256sum "$WORK/r42/r36os-kernel-next-prepare" | awk '{print $1}')" == "$EXPECTED_R42_PREPARE" ]] || { echo r42-prepare-reconstruction-mismatch >&2; exit 14; }
          [[ "$(sha256sum "$WORK/r42/r36os-kernel-slot" | awk '{print $1}')" == "$EXPECTED_R42_SLOT" ]] || { echo r42-slot-reconstruction-mismatch >&2; exit 15; }

          python3 - "$WORK/base/payload/root/etc/r36os-core-manifest.sha256" "$WORK/r42/core-manifest.sha256" <<'PY'
          from pathlib import Path
          import sys
          repl={
          '/usr/local/bin/r36os-export-current-logs':'ef3330f91db693f8278952b67453fe096e70b48bcbce07d029681ff90894cd40',
          '/usr/local/bin/r36os-kernel-next-prepare':'0336d0f6d389641ddd4305a4d3f87ea85702fdeb5b750815397369e5160d3815',
          '/usr/local/bin/r36os-kernel-slot':'8ac6a7ec87d218c468fc1b4330ba61ad786eb6a728a5da7425b06379ce487805',
          }
          out=[]
          for line in Path(sys.argv[1]).read_text().splitlines():
              if not line.strip(): continue
              sha,path=line.split(None,1); path=path.strip()
              out.append(f"{repl.get(path,sha)}  {path}\n")
          Path(sys.argv[2]).write_text(''.join(out))
          PY
          [[ "$(sha256sum "$WORK/r42/core-manifest.sha256" | awk '{print $1}')" == "$EXPECTED_R42_CORE_MANIFEST" ]] || { echo r42-core-manifest-reconstruction-mismatch >&2; exit 16; }

          # Promote only non-secret effective R42 runtime into R43.
          python3 - "$WORK/r42/r36os-kernel-next-prepare" "$WORK/update/payload/root/usr/local/bin/r36os-kernel-next-prepare" <<'PY'
          from pathlib import Path
          import sys
          s=Path(sys.argv[1]).read_text()
          if s.count('0.5.42.0') != 1: raise SystemExit('unexpected R42 prepare identity')
          Path(sys.argv[2]).write_text(s.replace('0.5.42.0','0.5.43.0'))
          PY
          python3 - "$WORK/r42/r36os-kernel-slot" "$WORK/update/payload/root/usr/local/bin/r36os-kernel-slot" <<'PY'
          from pathlib import Path
          import sys
          s=Path(sys.argv[1]).read_text()
          checks={'0.5.42.0':1,'Alpha 5R42':1,'r42-runtime-lock':1}
          for n,c in checks.items():
              if s.count(n)!=c: raise SystemExit(f'unexpected R42 slot identity: {n}')
          s=s.replace('0.5.42.0','0.5.43.0').replace('Alpha 5R42','Alpha 5R43').replace('r42-runtime-lock','r43-runtime-lock')
          Path(sys.argv[2]).write_text(s)
          PY
          cp "$HERE/r36os-export-current-logs" "$WORK/update/payload/root/usr/local/bin/r36os-export-current-logs"
          cp "$HERE/r36os-r36update-repair" "$WORK/update/payload/root/usr/local/bin/r36os-r36update-repair"
          cp "$HERE/r36os-diagnostic-snapshot" "$WORK/update/payload/root/usr/local/bin/r36os-diagnostic-snapshot"
          python3 - "$WORK/base/payload/root/usr/local/bin/r36os-firstboot-update-repair" "$WORK/update/payload/root/usr/local/bin/r36os-firstboot-update-repair" <<'PY_FB'
          from pathlib import Path
          import sys
          s=Path(sys.argv[1]).read_text()
          if s.count('0.5.41.0') != 1:
              raise SystemExit('unexpected R41 firstboot identity')
          Path(sys.argv[2]).write_text(s.replace('0.5.41.0','0.5.43.0'))
          PY_FB
          chmod 0755 "$WORK/update/payload/root/usr/local/bin/"r36os-*

          for f in r36os-export-current-logs r36os-r36update-repair r36os-diagnostic-snapshot r36os-firstboot-update-repair; do bash -n "$WORK/update/payload/root/usr/local/bin/$f"; done

          for f in fsck.fat-static fsck.fat-static.sha256 BUILD_INFO.txt; do test -s "$FSCKDIR/$f" || { echo "missing $f" >&2; exit 17; }; done
          for f in fsck-selftest.img.gz fsck-selftest.img.gz.sha256; do test -s "$FIXDIR/$f" || { echo "missing $f" >&2; exit 18; }; done
          cp "$FSCKDIR/fsck.fat-static" "$WORK/update/payload/root/usr/local/libexec/r36os/fsck.fat-static"
          cp "$FSCKDIR/fsck.fat-static.sha256" "$WORK/update/payload/root/usr/local/libexec/r36os/fsck.fat-static.sha256"
          cp "$FSCKDIR/BUILD_INFO.txt" "$WORK/update/payload/root/usr/local/libexec/r36os/fsck-fat-BUILD_INFO.txt"
          cp "$FIXDIR/fsck-selftest.img.gz" "$WORK/update/payload/root/usr/local/libexec/r36os/fsck-selftest.img.gz"
          cp "$FIXDIR/fsck-selftest.img.gz.sha256" "$WORK/update/payload/root/usr/local/libexec/r36os/fsck-selftest.img.gz.sha256"
          chmod 0755 "$WORK/update/payload/root/usr/local/libexec/r36os/fsck.fat-static"
          chmod 0644 "$WORK/update/payload/root/usr/local/libexec/r36os/"{fsck.fat-static.sha256,fsck-fat-BUILD_INFO.txt,fsck-selftest.img.gz,fsck-selftest.img.gz.sha256}
          (cd "$WORK/update/payload/root/usr/local/libexec/r36os" && sha256sum -c fsck.fat-static.sha256 >/dev/null && sha256sum -c fsck-selftest.img.gz.sha256 >/dev/null)

          cat >"$WORK/update/payload/root/etc/r36os/r36update-repair-once.conf" <<'EOF_MARK'
          format=R36OS_R36UPDATE_REPAIR_ONCE_V1
          release=0.5.43.0
          reason=confirmed-mmcblk0p3-dirty-volume-r42-fsck-abort
          EOF_MARK
          chmod 0644 "$WORK/update/payload/root/etc/r36os/r36update-repair-once.conf"

          cat >"$WORK/update/payload/root/etc/r36os-release" <<EOF_RELEASE
          R36OS_NAME="R36OS"
          R36OS_VERSION="Alpha 5R43"
          R36OS_PACKAGE_VERSION="0.5.43.0"
          R36OS_HARDWARE="R36XX-RK3326"
          R36OS_CHANNEL="system-core"
          R36OS_BUILD_DATE="2026-09-28"
          R36OS_COMPATIBILITY="Audited R36UPDATE FAT repair compatibility from effective Alpha 5R42 runtime"
          R36OS_NOTES="Alpha 5R43 replaces the crashing R40 FAT checker, adds read-only checker qualification/fallback and full repair diagnostics, preserves the R42 GitHub log workflow, and leaves K1 binaries unchanged."
          EOF_RELEASE
          cat >"$WORK/update/payload/root/opt/r36os/features/alpha5r43" <<EOF_FEATURE
          R36OS Alpha 5R43
          - Replaces the R40 FAT checker that aborted on the physical R36S.
          - Qualifies a FAT checker read-only against the real R36UPDATE before any write.
          - Allows native checker fallback only before write mode begins; never switches after writing starts.
          - Preserves exact R42 two-pass diagnostics queue draining and device-local credential/config.
          - Captures full bounded repair logs and checker-selection evidence.
          - K1 candidate $CID / kernel $KREL binaries are unchanged.
          EOF_FEATURE
          chmod 0644 "$WORK/update/payload/root/etc/r36os-release" "$WORK/update/payload/root/opt/r36os/features/alpha5r43"

          python3 - "$WORK/r42/core-manifest.sha256" "$WORK/update/payload/root" "$WORK/update/payload/root/etc/r36os-core-manifest.sha256" <<'PY'
          from pathlib import Path
          import hashlib,sys
          base=Path(sys.argv[1]); root=Path(sys.argv[2]); out=Path(sys.argv[3]); entries={}; order=[]
          for line in base.read_text().splitlines():
              if not line.strip(): continue
              sha,path=line.split(None,1); path=path.strip(); entries[path]=sha; order.append(path)
          paths=[
          '/usr/local/bin/r36os-kernel-next-prepare',
          '/usr/local/bin/r36os-kernel-slot',
          '/usr/local/bin/r36os-export-current-logs',
          '/usr/local/bin/r36os-r36update-repair',
          '/usr/local/bin/r36os-diagnostic-snapshot',
          '/usr/local/bin/r36os-firstboot-update-repair',
          '/usr/local/libexec/r36os/fsck.fat-static',
          '/usr/local/libexec/r36os/fsck.fat-static.sha256',
          '/usr/local/libexec/r36os/fsck-fat-BUILD_INFO.txt',
          '/usr/local/libexec/r36os/fsck-selftest.img.gz',
          '/usr/local/libexec/r36os/fsck-selftest.img.gz.sha256',
          ]
          for path in paths:
              p=root/path.lstrip('/')
              entries[path]=hashlib.sha256(p.read_bytes()).hexdigest()
              if path not in order: order.append(path)
          out.write_text(''.join(f'{entries[p]}  {p}\n' for p in order))
          PY

          cat >"$WORK/update/manifest.conf" <<EOF_MAN
          format=R36UPD2
          version=0.5.43.0
          hardware=R36XX-RK3326
          base_version=0.5.42.0
          channel=system-core
          requires_reboot=true
          description=Alpha 5R43 replaces the physical-device-crashing FAT checker with an audited target checker and read-only qualification/fallback repair path. R42 diagnostics behavior is preserved and K1 binaries are unchanged.
          candidate_id=$CID
          kernel_release=$KREL
          k1_binary_change=no
          r36update_repair=readonly-qualification-same-checker-write-final-verify
          remote_diagnostics=preserve-r42-private-device-state-two-pass-drain
          EOF_MAN

          (cd "$WORK/update" && find payload/root -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum >checksums.sha256)

          if find "$WORK/update/payload/root" -type f | grep -Eq '/(boot/|lib/modules/|usr/lib/modules/)'; then echo active-boot-or-module-payload-forbidden >&2; exit 20; fi
          if find "$WORK/update/payload/root" -type l -print -quit | grep -q .; then echo symlink-payload-forbidden >&2; exit 21; fi
          if find "$WORK/update/payload/root" -type f | grep -Eq '/r36state/(secrets|config)/'; then echo device-state-secret-config-payload-forbidden >&2; exit 22; fi
          if grep -R -n -E 'github_pat_|gh[pousr]_' "$WORK/update/payload/root"; then echo credential-pattern-forbidden >&2; exit 23; fi
          if find "$WORK/update/payload/root" -type f | grep -Eq '/opt/r36os/kernel-next/K1/(Image|uInitrd|rk3326-r36s-k1.dtb|modules.tar.xz)$'; then echo k1-binary-payload-forbidden >&2; exit 24; fi
          [[ "$(sha256sum "$WORK/update/payload/root/usr/local/bin/r36os-export-current-logs" | awk '{print $1}')" == "$EXPECTED_R42_EXPORT" ]] || { echo r42-export-regressed >&2; exit 25; }
          grep -q '0.5.43.0' "$WORK/update/payload/root/usr/local/bin/r36os-kernel-next-prepare"
          grep -q '0.5.43.0' "$WORK/update/payload/root/usr/local/bin/r36os-kernel-slot"
          grep -q 'Alpha 5R43' "$WORK/update/payload/root/usr/local/bin/r36os-kernel-slot"
          grep -q 'r43-runtime-lock' "$WORK/update/payload/root/usr/local/bin/r36os-kernel-slot"
          ! grep -R -n -E '0\.5\.42\.0|Alpha[[:space:]]*5R42|r42-runtime-lock' "$WORK/update/payload/root/usr/local/bin/r36os-kernel-next-prepare" "$WORK/update/payload/root/usr/local/bin/r36os-kernel-slot"

          (cd "$WORK/update"; tar --sort=name --mtime='UTC 2026-09-28 00:00:00' --owner=0 --group=0 --numeric-owner -cf - manifest.conf checksums.sha256 payload | gzip -1 -n >"$OUT/$NAME")
          SHA="$(sha256sum "$OUT/$NAME" | awk '{print $1}')"
          SIZE="$(stat -c %s "$OUT/$NAME")"
          printf '%s  %s\n' "$SHA" "$NAME" >"$OUT/$NAME.sha256"

          AUD="$WORK/audit"; mkdir -p "$AUD"; tar -xzf "$OUT/$NAME" -C "$AUD"; (cd "$AUD" && sha256sum -c checksums.sha256 >/dev/null)
          for f in "$AUD"/payload/root/usr/local/bin/r36os-*; do bash -n "$f"; done

          cat >"$OUT/latest.conf" <<EOF_LATEST
          format=R36OS_REMOTE_UPDATE_V1
          repo=$REPO
          available=yes
          channel=alpha
          version=0.5.43.0
          base_version=0.5.42.0
          filename=$NAME
          size_bytes=$SIZE
          sha256=$SHA
          url=https://github.com/$REPO/releases/download/$TAG/$NAME
          candidate_id=$CID
          kernel_release=$KREL
          EOF_LATEST
          cat >"$OUT/RELEASE_REPORT.txt" <<EOF_REPORT
          R36OS Alpha 5R43 audited release build PASS
          base_version=0.5.42.0
          version=0.5.43.0
          candidate_id=$CID
          kernel_release=$KREL
          k1_binary_change=no
          r41_source_sha256=$EXPECTED_R41
          r42_effective_core_manifest_sha256=$EXPECTED_R42_CORE_MANIFEST
          r42_export_sha256=$EXPECTED_R42_EXPORT
          fsck_sha256=$(sha256sum "$FSCKDIR/fsck.fat-static" | awk '{print $1}')
          package=$NAME
          size_bytes=$SIZE
          sha256=$SHA
          EOF_REPORT

          echo "R43_RELEASE_BUILD=PASS size=$SIZE sha256=$SHA"
          EOF_BUILDER

          chmod 0755 r43-release/build_release.sh
          bash -n r43-release/build_release.sh
          echo 'bfde1925c0b734309fff7ef8ea56674610a8670713a7abfafa68d4727697e698  r43-release/build_release.sh' | sha256sum -c -

      - name: Commit staging builder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'R36OS Build Bot'
          git config user.email 'r36os-build-bot@users.noreply.github.com'
          git add r43-release/build_release.sh
          git commit -m 'Stage R43 audited release builder'
          git push origin HEAD:work/r43-source-staging-2026-09-28
