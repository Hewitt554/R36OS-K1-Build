name: Publish R36OS Alpha 5R48 exact validated artifact

on:
  push:
    branches:
      - work/r48-stale-k1-disarm-before-fat-repair-2026-09-29
    paths:
      - '.github/workflows/publish-r48.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REPO: Hewitt554/R36OS-K1-Build
      VALIDATION_RUN: '36567008863'
      VALIDATION_ARTIFACT_ID: '11032466023'
      VALIDATED_SOURCE_SHA: ed657a409838d1e6aada8ad6fb0ec092bc33ce93
      PREPUBLISH_MAIN_SHA: 0fd945b7cad9684249159303cb83062d2896680a
      TAG: alpha5r48
      NAME: 00-R36OS-Alpha5R48-StaleK1DisarmBeforeFATRepair-FromR47.r36upd
      EXPECTED_SHA: 37ba7053807b1c331176b74963640f4ee6b982c19d533e7febebb29d16d17a98
      EXPECTED_SIZE: '403679'

    steps:
      - uses: actions/checkout@v4

      - name: Download exact validated artifact and prove lineage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN="$(gh api "repos/$REPO/actions/runs/$VALIDATION_RUN")"
          test "$(printf '%s' "$RUN" | jq -r .conclusion)" = success
          test "$(printf '%s' "$RUN" | jq -r .head_sha)" = "$VALIDATED_SOURCE_SHA"

          ART="$(gh api "repos/$REPO/actions/artifacts/$VALIDATION_ARTIFACT_ID")"
          test "$(printf '%s' "$ART" | jq -r .name)" = R36OS-Alpha5R48-audited-validation-candidate
          test "$(printf '%s' "$ART" | jq -r .expired)" = false

          gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/actions/artifacts/$VALIDATION_ARTIFACT_ID/zip" > candidate.zip
          rm -rf candidate
          mkdir candidate
          unzip -q candidate.zip -d candidate

          PKG="$(find candidate -type f -name "$NAME" -print)"
          SHA_FILE="$(find candidate -type f -name "$NAME.sha256" -print)"
          LATEST="$(find candidate -type f -name latest.conf -print)"
          REPORT="$(find candidate -type f -name RELEASE_REPORT.txt -print)"
          AUDIT="$(find candidate -type f -name R48_AUDIT.md -print)"
          for v in PKG SHA_FILE LATEST REPORT AUDIT; do
            p="${!v}"
            test -n "$p" && test -f "$p"
            echo "$v=$p" >> "$GITHUB_ENV"
          done

      - name: Audit exact downloaded R48 package
        run: |
          set -euo pipefail
          test "$(stat -c %s "$PKG")" = "$EXPECTED_SIZE"
          test "$(sha256sum "$PKG" | awk '{print $1}')" = "$EXPECTED_SHA"
          grep -Fxq "$EXPECTED_SHA  $NAME" "$SHA_FILE"
          test "$(awk -F= '$1=="version"{print $2}' "$LATEST")" = 0.5.48.0
          test "$(awk -F= '$1=="base_version"{print $2}' "$LATEST")" = 0.5.47.0
          test "$(awk -F= '$1=="filename"{print $2}' "$LATEST")" = "$NAME"
          test "$(awk -F= '$1=="size_bytes"{print $2}' "$LATEST")" = "$EXPECTED_SIZE"
          test "$(awk -F= '$1=="sha256"{print $2}' "$LATEST")" = "$EXPECTED_SHA"

          grep -Fxq 'version=0.5.48.0' "$REPORT"
          grep -Fxq 'base_version=0.5.47.0' "$REPORT"
          grep -Fxq 'k1_binary_change=no' "$REPORT"
          grep -Fxq 'repair_deferred_during_transaction=yes' "$REPORT"
          grep -Fxq 'stale_cleanup_only_armed_yes_consumed_no=yes' "$REPORT"
          grep -Fxq 'disarm_full_candidate_verify=yes' "$REPORT"
          grep -Fxq 'disarm_marker_clear_readback=yes' "$REPORT"

          rm -rf package-audit
          mkdir package-audit
          tar -xzf "$PKG" -C package-audit
          (cd package-audit && sha256sum -c checksums.sha256 >/dev/null)
          test "$(awk -F= '$1=="version"{print $2}' package-audit/manifest.conf)" = 0.5.48.0
          test "$(awk -F= '$1=="base_version"{print $2}' package-audit/manifest.conf)" = 0.5.47.0
          test "$(awk -F= '$1=="k1_binary_change"{print $2}' package-audit/manifest.conf)" = no
          test "$(awk -F= '$1=="repair_activation"{print $2}' package-audit/manifest.conf)" = defer-while-transaction-pending
          test "$(awk -F= '$1=="stale_k1_cleanup"{print $2}' package-audit/manifest.conf)" = armed-yes-consumed-no-only-full-verify-fail-closed
          test ! -e package-audit/payload/root/r36state
          ! find package-audit/payload/root -type f | grep -Eq '/(boot/|lib/modules/|usr/lib/modules/)'
          ! find package-audit/payload/root -type f | grep -Eq '/opt/r36os/kernel-next/K1/(Image|uInitrd|rk3326-r36s-k1.dtb|modules.tar.xz)$'
          echo R48_PREPUBLISH_AUDIT=PASS

      - name: Create prerelease and upload exact validated assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "$TAG already exists" >&2
            exit 30
          fi
          cat >/tmp/notes.txt <<'EOF'
          R36OS Alpha 5R48

          Corrective update from Alpha 5R47.

          - Fixes the R47 repair-order blocker found in physical logs: the old K1 one-shot request remained armed=yes / consumed=no, so the FAT repair correctly stopped at code 45.
          - Defers FAT repair during the transactional activation boot so update health and filesystem repair do not compete.
          - On the next ordinary boot, automatic stale-request cleanup is permitted only for armed=yes / consumed=no.
          - Full K1 candidate verification is mandatory before disarm, and marker removal is read back and verified.
          - The exact final R43 FAT repair/checker/fixture remain unchanged.
          - Does not replace K1 Image, DTB, uInitrd, or modules.
          - Legacy Linux 4.4 remains the fallback.
          - Do not use Boot Next Once until post-repair diagnostics are checked.
          EOF

          gh release create "$TAG" --repo "$REPO" --target "$VALIDATED_SOURCE_SHA" --title 'R36OS Alpha 5R48 — stale K1 disarm before FAT repair' --notes-file /tmp/notes.txt --prerelease
          gh release upload "$TAG" "$PKG" "$SHA_FILE" "$REPORT" "$AUDIT" --repo "$REPO"

      - name: Verify published package before channel update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REL="$(gh api "repos/$REPO/releases/tags/$TAG")"
          test "$(printf '%s' "$REL" | jq -r .prerelease)" = true
          test "$(printf '%s' "$REL" | jq -r .target_commitish)" = "$VALIDATED_SOURCE_SHA"
          ASSET_ID="$(printf '%s' "$REL" | jq -r --arg n "$NAME" '.assets[] | select(.name==$n) | .id')"
          SIZE="$(printf '%s' "$REL" | jq -r --arg n "$NAME" '.assets[] | select(.name==$n) | .size')"
          test -n "$ASSET_ID"
          test "$SIZE" = "$EXPECTED_SIZE"
          gh api -H 'Accept: application/octet-stream' "repos/$REPO/releases/assets/$ASSET_ID" >/tmp/published.r36upd
          test "$(stat -c %s /tmp/published.r36upd)" = "$EXPECTED_SIZE"
          test "$(sha256sum /tmp/published.r36upd | awk '{print $1}')" = "$EXPECTED_SHA"
          echo R48_PUBLISHED_ASSET_VERIFY=PASS

      - name: Advance live channel from R47 to R48
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$PREPUBLISH_MAIN_SHA"
          git checkout -B publish-r48-main origin/main
          cp "$LATEST" r36os-release-channel/latest.conf
          git config user.name 'R36OS Release Bot'
          git config user.email 'r36os-release-bot@users.noreply.github.com'
          git add r36os-release-channel/latest.conf
          git diff --cached --check
          git commit -m 'Publish Alpha 5R48 update channel'
          CHANNEL_COMMIT="$(git rev-parse HEAD)"
          echo "CHANNEL_COMMIT=$CHANNEL_COMMIT" >> "$GITHUB_ENV"
          git push origin HEAD:main

      - name: Preserve post-publish evidence and backup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$CHANNEL_COMMIT"
          git show "$CHANNEL_COMMIT:r36os-release-channel/latest.conf" >/tmp/live-latest.conf
          cmp /tmp/live-latest.conf "$LATEST"
          cat >/tmp/PUBLISH_EVIDENCE.txt <<EOF
          R36OS Alpha 5R48 publish evidence
          validation_run=$VALIDATION_RUN
          validation_artifact_id=$VALIDATION_ARTIFACT_ID
          validated_source_sha=$VALIDATED_SOURCE_SHA
          prepublish_main_sha=$PREPUBLISH_MAIN_SHA
          channel_commit=$CHANNEL_COMMIT
          tag=$TAG
          package=$NAME
          size_bytes=$EXPECTED_SIZE
          sha256=$EXPECTED_SHA
          exact_validated_artifact=yes
          rebuilt_at_publish=no
          EOF
          gh release upload "$TAG" /tmp/PUBLISH_EVIDENCE.txt --repo "$REPO"
          git push origin "$CHANNEL_COMMIT:refs/heads/backup/r48-postpublish-verified-2026-09-29"
          echo R48_PUBLISH=PASS
