name: R60 CP03 recover graphics runtime scripts

on:
  push:
    branches:
      - work/r60-checkpointed-k1-baseline-fixes-2026-10-01
    paths:
      - '.github/workflows/r60-cp03-runtime-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Decode intact R39 override archive
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          mkdir -p recovered/r39-overrides targets
          git show origin/main:r39-release/final-source-overrides.tar.gz.b64 >recovered/overrides.b64
          base64 -d recovered/overrides.b64 >recovered/overrides.tar.gz
          tar -tzf recovered/overrides.tar.gz >recovered/override-members.txt
          tar -xzf recovered/overrides.tar.gz -C recovered/r39-overrides
          find recovered/r39-overrides -type f -printf '%p %s\n' | sort | tee recovered/inventory.txt
          echo R60_CP03_OVERRIDE_DECODE=PASS

      - name: Find exact runtime scripts by pinned R58 core hashes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil
          wanted={
            'r36os-graphics-test-session':'764fe5cb26da8ba66701c1154fbef8e3f944f9fe2330180cd97829c20aa88393',
            'r36os-graphics-test-inner':'4004f64a65d25671bfa57db9b28f741bf7bcef813f391b267cf5ca636df4e9c6',
            'r36os-input-supervisor':'7a3e941160d8bc4efbac1b607dab47f17ebd21239a482a7683fe28702923ab45',
          }
          root=Path('recovered/r39-overrides')
          report=[]
          found={}
          for p in root.rglob('*'):
              if not p.is_file(): continue
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              for name,need in wanted.items():
                  if p.name==name or h==need:
                      report.append(f'{name}\t{h}\t{p}')
                      if h==need and name not in found:
                          found[name]=p
          for name,need in wanted.items():
              if name not in found:
                  report.append(f'MISSING\t{name}\t{need}')
              else:
                  shutil.copy2(found[name],Path('targets')/name)
          Path('recovered/target-report.txt').write_text('\n'.join(report)+'\n')
          print('\n'.join(report))
          Path('recovered/found-count.txt').write_text(str(len(found))+'\n')
          PY

      - name: Extract readiness logic from exact recovered targets
        run: |
          set -euo pipefail
          COUNT="$(cat recovered/found-count.txt)"
          echo "exact_target_count=$COUNT"
          test "$COUNT" -gt 0
          for f in targets/*; do
            echo "===== $f ====="
            sha256sum "$f"
            grep -nEi 'ready|input|supervisor|event|gamepad|gpio|adc|weston|handoff|graphics|FAIL|timeout' "$f" | head -500 || true
          done | tee recovered/readiness-excerpts.txt

      - name: Upload runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: R60-CP03-graphics-runtime-evidence
          path: |
            targets/
            recovered/target-report.txt
            recovered/readiness-excerpts.txt
            recovered/inventory.txt
            recovered/override-members.txt
            recovered/found-count.txt
          if-no-files-found: error
          retention-days: 30
