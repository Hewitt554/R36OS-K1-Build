name: R60 CP03 recover graphics runtime scripts

on:
  push:
    branches:
      - work/r60-checkpointed-k1-baseline-fixes-2026-10-01
    paths:
      - '.github/workflows/r60-cp03-runtime-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Deterministically repair one-character R39 source split
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          mkdir -p recovered/r39-final targets
          git show origin/main:r39-release/final-source.b64.part00 | tr -d '\r\n\t ' >recovered/p0
          git show origin/main:r39-release/final-source.b64.part01 | tr -d '\r\n\t ' >recovered/p1
          git show origin/main:r39-release/final-source.b64.part02 | tr -d '\r\n\t ' >recovered/p2
          test "$(wc -c <recovered/p0)" -eq 18000
          test "$(wc -c <recovered/p1)" -eq 17999
          test "$(wc -c <recovered/p2)" -eq 18000

          python3 - <<'PY'
          from pathlib import Path
          import base64, io, zipfile
          chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          p0=Path('recovered/p0').read_text()
          p1=Path('recovered/p1').read_text()
          p2=Path('recovered/p2').read_text()
          valid=[]
          # Historical chunks were intended at fixed 18000-char boundaries.
          # Restore exactly one missing character at the end of short part01.
          for ch in chars:
              s=p0+p1+ch+p2
              try:
                  raw=base64.b64decode(s,validate=True)
                  z=zipfile.ZipFile(io.BytesIO(raw),'r')
                  names=z.namelist()
                  bad=z.testzip()
                  if bad is None and names:
                      valid.append((ch,raw,names))
              except Exception:
                  pass
          if len(valid)!=1:
              raise SystemExit(f'expected exactly one CRC-valid recovery, got {len(valid)} chars={[v[0] for v in valid]}')
          ch,raw,names=valid[0]
          Path('recovered/recovered-char.txt').write_text(ch+'\n')
          Path('recovered/r39-final.zip').write_bytes(raw)
          with zipfile.ZipFile(io.BytesIO(raw),'r') as z:
              z.extractall('recovered/r39-final')
          print('R60_CP03_ZIP_RECOVERY=PASS inserted_char='+ch+' files='+str(len(names)))
          PY

          find recovered/r39-final -type f -printf '%p %s\n' | sort | tee recovered/inventory.txt

      - name: Find exact runtime scripts by pinned R58 core hashes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil
          wanted={
            'r36os-graphics-test-session':'764fe5cb26da8ba66701c1154fbef8e3f944f9fe2330180cd97829c20aa88393',
            'r36os-graphics-test-inner':'4004f64a65d25671bfa57db9b28f741bf7bcef813f391b267cf5ca636df4e9c6',
            'r36os-input-supervisor':'7a3e941160d8bc4efbac1b607dab47f17ebd21239a482a7683fe28702923ab45',
          }
          root=Path('recovered/r39-final')
          report=[]; exact={}
          for p in root.rglob('*'):
              if not p.is_file(): continue
              data=p.read_bytes(); h=hashlib.sha256(data).hexdigest()
              for name,need in wanted.items():
                  if p.name==name or h==need:
                      report.append(f'{name}\t{h}\t{p}')
                      if h==need and name not in exact:
                          Path('targets',name).write_bytes(data)
                          exact[name]=p
          for name,need in wanted.items():
              if name not in exact: report.append(f'MISSING_EXACT\t{name}\t{need}')
          Path('recovered/target-report.txt').write_text('\n'.join(report)+'\n')
          print('\n'.join(report))
          if len(exact)!=3:
              raise SystemExit(f'exact runtime recovery incomplete: {len(exact)}/3')
          PY

      - name: Extract exact readiness logic
        run: |
          set -euo pipefail
          for f in targets/*; do
            echo "===== $f ====="
            sha256sum "$f"
            grep -nEi 'ready|input|supervisor|event|gamepad|gpio|adc|weston|handoff|graphics|FAIL|timeout' "$f" | head -700 || true
          done | tee recovered/readiness-excerpts.txt
          echo R60_CP03_EXACT_RUNTIME_RECOVERY=PASS

      - name: Upload exact runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: R60-CP03-exact-graphics-runtime
          path: |
            targets/
            recovered/target-report.txt
            recovered/readiness-excerpts.txt
            recovered/inventory.txt
            recovered/recovered-char.txt
          if-no-files-found: error
          retention-days: 30
