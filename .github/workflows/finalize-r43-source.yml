name: Finalize clean R43 source checkpoint

on:
  push:
    branches:
      - work/r43-clean-rebuild-2026-09-28
    paths:
      - '.github/workflows/finalize-r43-source.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Import exact audited staging blobs
        shell: bash
        run: |
          set -euo pipefail
          STAGING_COMMIT='9cbc6393e15a77dfb59b791c2c8c6c069bfbefb5'
          git fetch origin "$STAGING_COMMIT"
          git checkout "$STAGING_COMMIT" --             .github/workflows/validate-r43-clean.yml             r43-release/build_fixture.sh             r43-release/build_fsck.sh             r43-release/build_release.sh             r43-release/fat_fixture_tool.py             r43-release/qemu-fsck-wrapper.sh             r43-release/r36os-diagnostic-snapshot             r43-release/r36os-export-current-logs             r43-release/r36os-r36update-repair             r43-release/test_r43_repair.sh             r43-release/test_target_fsck.sh

          cat >/tmp/r43-source.sha256 <<'EOF'
          652ece1024c4f01ef97e312bc3e3084922d502b928bd0e4c760b57c8ef13e882  r43-release/build_fixture.sh
          73d8158e59d1c32de1339c39e3f3e03fbef582a6e7680a569efb7e108b2e11bf  r43-release/build_fsck.sh
          bfde1925c0b734309fff7ef8ea56674610a8670713a7abfafa68d4727697e698  r43-release/build_release.sh
          d8f384ab513a169ff2e9e859fc1d7508e646fcd7c730a94efebba44b6c558a87  r43-release/fat_fixture_tool.py
          8a173af84efea0034e78cb6733cf9560e6a538cf2c1836911702e11137b16397  r43-release/qemu-fsck-wrapper.sh
          df0ba17d4d22580ca4e2a9a42e511a30df666afcf332fe179000fa6b32f9c694  r43-release/r36os-diagnostic-snapshot
          ef3330f91db693f8278952b67453fe096e70b48bcbce07d029681ff90894cd40  r43-release/r36os-export-current-logs
          396e6fcea8961cbfea4bafad92573e41fdfee80df1eae73f4eb8ee13a6687082  r43-release/r36os-r36update-repair
          3e4badccac4eb3e7930b8f586f366b8369da61d0bb20d316c87ef6f07059d159  r43-release/test_r43_repair.sh
          53151785c6c39f1a15c7a38deff0ecfc9a36ce7c3c6981d1aef1b3e024738526  r43-release/test_target_fsck.sh
          72e1499974a5a41f08e15079db145bdf726019bc30201d087eb79d09b0b472bd  .github/workflows/validate-r43-clean.yml
          EOF
          sha256sum -c /tmp/r43-source.sha256

          for f in r43-release/*.sh r43-release/r36os-*; do bash -n "$f"; done
          python3 -m py_compile r43-release/fat_fixture_tool.py
          rm -rf r43-release/__pycache__

          # Remove temporary clean-branch transport/checkpoint files.
          git rm -f .github/workflows/bootstrap-r43-direct.yml 2>/dev/null || true
          git rm -f r43-release/README-AUDIT-CHECKPOINT.md 2>/dev/null || true
          git rm -f .github/workflows/finalize-r43-source.yml

          # No opaque source archive or credential value may enter the authority branch.
          test ! -e r43-release/source.tar.gz
          if grep -R -n -E 'github_pat_[A-Za-z0-9]|gh[pousr]_[A-Za-z0-9]' r43-release R43_FULL_AUDIT.md .github/workflows/validate-r43-clean.yml; then
            echo credential-value-found >&2
            exit 20
          fi

      - name: Commit one authoritative R43 source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'R36OS Build Bot'
          git config user.email 'r36os-build-bot@users.noreply.github.com'
          git add r43-release .github/workflows/validate-r43-clean.yml R43_FULL_AUDIT.md
          git status --short
          git commit -m 'Install clean audited Alpha 5R43 source set'
          git push origin HEAD:work/r43-clean-rebuild-2026-09-28
