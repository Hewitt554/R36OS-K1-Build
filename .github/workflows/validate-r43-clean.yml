name: Validate R36OS Alpha 5R43 Clean Rebuild

on:
  push:
    branches:
      - work/r43-clean-rebuild-2026-09-28
    paths:
      - 'r43-release/**'
      - 'R43_FULL_AUDIT.md'
      - '.github/workflows/validate-r43-clean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install host validation tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dosfstools qemu-user-static binutils-aarch64-linux-gnu file

      - name: Download exact audited public inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs
          gh release download alpha5r41 --repo Hewitt554/R36OS-K1-Build --pattern '00-R36OS-Alpha5R41-FirstBootRepairFix-FromR40.r36upd' --dir inputs
          gh release download alpha5r40 --repo Hewitt554/R36OS-K1-Build --pattern 'dosfstools-4.2.tar.gz' --dir inputs
          echo 'ac3e350a7332ee3da4624952a15cfdc83cb04c767038e0c0d1015a078a237567  inputs/00-R36OS-Alpha5R41-FirstBootRepairFix-FromR40.r36upd' | sha256sum -c -
          echo '64926eebf90092dca21b14259a5301b7b98e7b1943e8a201c7d726084809b527  inputs/dosfstools-4.2.tar.gz' | sha256sum -c -

      - name: Audit all R43 sources before build
        run: |
          set -euo pipefail
          for f in r43-release/build_fsck.sh r43-release/build_fixture.sh r43-release/build_release.sh r43-release/qemu-fsck-wrapper.sh r43-release/test_r43_repair.sh r43-release/test_target_fsck.sh r43-release/r36os-export-current-logs r43-release/r36os-r36update-repair r43-release/r36os-diagnostic-snapshot; do
            bash -n "$f"
          done
          python3 -m py_compile r43-release/fat_fixture_tool.py
          test "$(sha256sum r43-release/r36os-export-current-logs | awk '{print $1}')" = ef3330f91db693f8278952b67453fe096e70b48bcbce07d029681ff90894cd40
          grep -q -- '--without-iconv' r43-release/build_fsck.sh
          grep -q 'EXPECTED_R42_CORE_MANIFEST=.c15ab3d6da735f1a9db034a3a2c12b2150afb7a07defd9d888ccbfb63c95c898.' r43-release/build_release.sh
          grep -q 'R36OS_FSCK_NATIVE_CANDIDATES' r43-release/r36os-r36update-repair
          grep -q 'r36update-repair-full-log' r43-release/r36os-diagnostic-snapshot
          grep -q 'unexpected R41 firstboot identity' r43-release/build_release.sh
          if grep -R -n -E 'github_pat_|gh[pousr]_' r43-release R43_FULL_AUDIT.md; then
            echo credential-pattern-found-in-public-source >&2
            exit 20
          fi
          test ! -e r43-release/source.tar.gz
          echo R43_SOURCE_AUDIT=PASS

      - name: Build replacement AArch64 checker twice
        run: |
          set -euo pipefail
          IMAGE='ubuntu@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214'
          for n in a b; do
            docker run --rm -v "$PWD:/work" -w /work "$IMAGE" bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update >/dev/null
              apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu autoconf automake autopoint gettext pkg-config make >/dev/null
              ./r43-release/build_fsck.sh /work/inputs/dosfstools-4.2.tar.gz /work/fsck-'"$n"'
            '
          done
          cmp fsck-a/fsck.fat-static fsck-b/fsck.fat-static
          cmp fsck-a/fsck.fat-static.sha256 fsck-b/fsck.fat-static.sha256
          test "$(sha256sum fsck-a/fsck.fat-static | awk '{print $1}')" = a5a8360adabc544eddfe07a865bd77035be56c358dfe19aeeac84718b24680b6
          file fsck-a/fsck.fat-static | tee fsck-a/file.txt
          grep -q 'ARM aarch64' fsck-a/file.txt
          grep -q 'statically linked' fsck-a/file.txt
          if aarch64-linux-gnu-readelf -d fsck-a/fsck.fat-static 2>/dev/null | grep -q NEEDED; then
            echo dynamic-dependency-found >&2
            exit 21
          fi
          if strings fsck-a/fsck.fat-static | grep -q 'iconv_init_codepage'; then
            echo iconv-code-found >&2
            exit 22
          fi
          grep -qx 'iconv=disabled' fsck-a/BUILD_INFO.txt
          echo R43_CHECKER_BUILD_AUDIT=PASS

      - name: Build deterministic clean FAT fixture
        run: |
          set -euo pipefail
          ./r43-release/build_fixture.sh fixture
          (cd fixture && sha256sum -c fsck-selftest.img.gz.sha256)
          gzip -dc fixture/fsck-selftest.img.gz > /tmp/r43-fixture.img
          /usr/bin/qemu-aarch64-static fsck-a/fsck.fat-static -n /tmp/r43-fixture.img > /tmp/r43-fixture-check.txt 2>&1
          echo R43_FIXTURE=PASS

      - name: Execute target checker repair matrix
        env:
          TARGET_FSCK: ${{ github.workspace }}/fsck-a/fsck.fat-static
          FIXTURE_GZ: ${{ github.workspace }}/fixture/fsck-selftest.img.gz
        run: |
          set -euo pipefail
          ./r43-release/test_target_fsck.sh

      - name: Execute full repair helper matrix
        env:
          TARGET_FSCK: ${{ github.workspace }}/fsck-a/fsck.fat-static
        run: |
          set -euo pipefail
          ./r43-release/test_r43_repair.sh

      - name: Build R43 twice from exact R41 plus audited effective R42 delta
        run: |
          set -euo pipefail
          R41="$PWD/inputs/00-R36OS-Alpha5R41-FirstBootRepairFix-FromR40.r36upd"
          ./r43-release/build_release.sh "$R41" "$PWD/fsck-a" "$PWD/fixture" "$PWD/out-a" | tee r43-build-a.log
          ./r43-release/build_release.sh "$R41" "$PWD/fsck-a" "$PWD/fixture" "$PWD/out-b" | tee r43-build-b.log

      - name: Audit deterministic R43 package
        run: |
          set -euo pipefail
          A=out-a/00-R36OS-Alpha5R43-FATRepairAudit-FromR42.r36upd
          B=out-b/00-R36OS-Alpha5R43-FATRepairAudit-FromR42.r36upd
          cmp "$A" "$B"
          diff -u out-a/latest.conf out-b/latest.conf
          diff -u out-a/RELEASE_REPORT.txt out-b/RELEASE_REPORT.txt
          rm -rf package-audit
          mkdir package-audit
          tar -xzf "$A" -C package-audit
          (cd package-audit && sha256sum -c checksums.sha256 >/dev/null)
          test "$(awk -F= '$1=="version"{print $2}' package-audit/manifest.conf)" = 0.5.43.0
          test "$(awk -F= '$1=="base_version"{print $2}' package-audit/manifest.conf)" = 0.5.42.0
          test "$(awk -F= '$1=="k1_binary_change"{print $2}' package-audit/manifest.conf)" = no
          test "$(sha256sum package-audit/payload/root/usr/local/bin/r36os-export-current-logs | awk '{print $1}')" = ef3330f91db693f8278952b67453fe096e70b48bcbce07d029681ff90894cd40
          test "$(sha256sum package-audit/payload/root/usr/local/libexec/r36os/fsck.fat-static | awk '{print $1}')" = a5a8360adabc544eddfe07a865bd77035be56c358dfe19aeeac84718b24680b6
          cmp fsck-a/fsck.fat-static package-audit/payload/root/usr/local/libexec/r36os/fsck.fat-static
          cmp fixture/fsck-selftest.img.gz package-audit/payload/root/usr/local/libexec/r36os/fsck-selftest.img.gz
          test ! -e package-audit/payload/root/r36state
          ! find package-audit/payload/root -type f | grep -Eq '/(boot/|lib/modules/|usr/lib/modules/)'
          ! find package-audit/payload/root -type f | grep -Eq '/opt/r36os/kernel-next/K1/(Image|uInitrd|rk3326-r36s-k1.dtb|modules.tar.xz)$'
          if grep -R -n -E 'github_pat_|gh[pousr]_' package-audit/payload/root; then
            echo credential-pattern-found-in-package >&2
            exit 30
          fi
          grep -q '0.5.43.0' package-audit/payload/root/usr/local/bin/r36os-kernel-next-prepare
          grep -q '0.5.43.0' package-audit/payload/root/usr/local/bin/r36os-kernel-slot
          grep -q 'Alpha 5R43' package-audit/payload/root/usr/local/bin/r36os-kernel-slot
          grep -q 'r43-runtime-lock' package-audit/payload/root/usr/local/bin/r36os-kernel-slot
          grep -q '^release=0.5.43.0$' package-audit/payload/root/etc/r36os/r36update-repair-once.conf
          grep -q '^r42_effective_core_manifest_sha256=c15ab3d6da735f1a9db034a3a2c12b2150afb7a07defd9d888ccbfb63c95c898$' out-a/RELEASE_REPORT.txt
          echo R43_PACKAGE_AUDIT=PASS

      - name: Upload single audited R43 candidate
        uses: actions/upload-artifact@v4
        with:
          name: R36OS-Alpha5R43-audited-validation-candidate
          path: |
            out-a/00-R36OS-Alpha5R43-FATRepairAudit-FromR42.r36upd
            out-a/00-R36OS-Alpha5R43-FATRepairAudit-FromR42.r36upd.sha256
            out-a/latest.conf
            out-a/RELEASE_REPORT.txt
            fsck-a/fsck.fat-static.sha256
            fsck-a/BUILD_INFO.txt
            r43-build-a.log
            r43-build-b.log
            R43_FULL_AUDIT.md
          if-no-files-found: error
          retention-days: 30
