name: Validate R36OS Alpha 5R50

on:
  push:
    branches:
      - work/r50-root-consumed-marker-kernel-status-2026-09-29
    paths:
      - 'r50-release/**'
      - '.github/workflows/validate-r50.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Download exact published R49 and R46 inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs
          gh release download alpha5r48 --repo Hewitt554/R36OS-K1-Build --pattern '00-R36OS-Alpha5R49-R36UpdateIsolationMaintenance-FromR48.r36upd' --dir inputs
          gh release download alpha5r46 --repo Hewitt554/R36OS-K1-Build --pattern '00-R36OS-Alpha5R46-K1HandoffProbe-FromR44.r36upd' --dir inputs
          echo '6a65fe9a952140ee0f380e9ef053d1ea7b658976ead496eda7bd30f9a83502cb  inputs/00-R36OS-Alpha5R49-R36UpdateIsolationMaintenance-FromR48.r36upd' | sha256sum -c -
          echo '9fd037fd79f78420c6f1b6e8df67db2280ed4339df714ef2aeadb225f4e95815  inputs/00-R36OS-Alpha5R46-K1HandoffProbe-FromR44.r36upd' | sha256sum -c -

      - name: Source audit
        run: |
          set -euo pipefail
          bash -n r50-release/r36os-running-kernel-status
          bash -n r50-release/build_release.sh
          python3 -m py_compile r50-release/*.py
          grep -Fq "cons='R36K1.CNS'" r50-release/generate_hook.py
          grep -Fq 'consumed_marker_mode=root-8.3' r50-release/generate_hook.py
          grep -Fq 'CONSUMED="$UPDATE_MOUNT/R36K1.CNS"' r50-release/transform_slot.py
          grep -Fq '/R36K1.CNS' r50-release/transform_health.py
          grep -Fq '/R36K1.CNS' r50-release/transform_maint.py
          if grep -R -n -E 'github_pat_[A-Za-z0-9]|gh[pousr]_[A-Za-z0-9]' r50-release; then exit 20; fi
          echo R50_SOURCE_AUDIT=PASS

      - name: Build R50 twice
        run: |
          set -euo pipefail
          chmod +x r50-release/build_release.sh
          R49="$PWD/inputs/00-R36OS-Alpha5R49-R36UpdateIsolationMaintenance-FromR48.r36upd"
          R46="$PWD/inputs/00-R36OS-Alpha5R46-K1HandoffProbe-FromR44.r36upd"
          ./r50-release/build_release.sh "$R49" "$R46" "$PWD/out-a" | tee r50-build-a.log
          ./r50-release/build_release.sh "$R49" "$R46" "$PWD/out-b" | tee r50-build-b.log

      - name: Audit deterministic package and hook migration
        run: |
          set -euo pipefail
          A=out-a/00-R36OS-Alpha5R50-RootConsumedKernelStatus-FromR49.r36upd
          B=out-b/00-R36OS-Alpha5R50-RootConsumedKernelStatus-FromR49.r36upd
          cmp "$A" "$B"
          diff -u out-a/latest.conf out-b/latest.conf
          diff -u out-a/RELEASE_REPORT.txt out-b/RELEASE_REPORT.txt

          rm -rf pkg r46
          mkdir pkg r46
          tar -xzf "$A" -C pkg
          tar -xzf inputs/00-R36OS-Alpha5R46-K1HandoffProbe-FromR44.r36upd -C r46
          (cd pkg && sha256sum -c checksums.sha256 >/dev/null)

          test "$(awk -F= '$1=="version"{print $2}' pkg/manifest.conf)" = 0.5.50.0
          test "$(awk -F= '$1=="base_version"{print $2}' pkg/manifest.conf)" = 0.5.49.0
          test "$(awk -F= '$1=="k1_binary_change"{print $2}' pkg/manifest.conf)" = no
          test "$(awk -F= '$1=="consumed_marker"{print $2}' pkg/manifest.conf)" = R36K1.CNS
          test "$(awk -F= '$1=="consumed_marker_mode"{print $2}' pkg/manifest.conf)" = root-8.3

          test ! -e pkg/payload/root/r36state
          ! find pkg/payload/root -type f | grep -Eq '/(boot/|lib/modules/|usr/lib/modules/)'
          ! find pkg/payload/root -type f | grep -Eq '/opt/r36os/kernel-next/K1/(Image|uInitrd|rk3326-r36s-k1.dtb|modules.tar.xz)$'
          ! find pkg/payload/root -type l | grep -q .

          HOOK=pkg/payload/root/opt/r36os/kernel-next/hooked-boot.ini
          META=pkg/payload/root/opt/r36os/kernel-next/hook.conf
          grep -Fq 'load mmc 1:3 ${loadaddr} "R36OS-KernelNext/boot-next.e551eb6598d6da7a8e8320e9.once"' "$HOOK"
          grep -Fq 'fatwrite mmc 1:3 ${loadaddr} "R36K1.CNS" ${r36os_req_size}' "$HOOK"
          grep -Fq 'load mmc 1:3 ${loadaddr} "R36K1.CNS"' "$HOOK"
          FATWRITE_LINES="$(grep 'fatwrite mmc 1:3' "$HOOK")"
          test -n "$FATWRITE_LINES"
          if printf '%s\n' "$FATWRITE_LINES" | grep -q '/'; then echo subdirectory-fatwrite-found >&2; exit 30; fi
          grep -Fxq 'consumed=R36K1.CNS' "$META"
          grep -Fxq 'consumed_marker_mode=root-8.3' "$META"

          PREV="$(awk -F= '$1=="hooked_boot_sha256"{print $2}' r46/payload/root/opt/r36os/kernel-next/hook.conf)"
          grep -Fq "PREV_HOOK_SHA='$PREV'" pkg/payload/root/usr/local/bin/r36os-k1-install-hook

          grep -Fq 'CONSUMED="$UPDATE_MOUNT/R36K1.CNS"' pkg/payload/root/usr/local/bin/r36os-kernel-slot
          grep -Fq 'CONSUMED="${R36OS_UPDATE_MOUNT:-/r36update}/R36K1.CNS"' pkg/payload/root/usr/local/bin/r36os-kernel-next-health
          grep -Fq 'WCON="$PRIVATE/R36K1.CNS"' pkg/payload/root/usr/local/bin/r36os-r36update-maint
          echo R50_PACKAGE_HOOK_AUDIT=PASS

      - name: Test live-kernel Diagnostics status helper
        run: |
          set -euo pipefail
          H=pkg/payload/root/usr/local/bin/r36os-running-kernel-status
          chmod +x "$H"
          echo 'root=x r36os.k1_probe=consumed_readback_failed' >/tmp/r50-cmdline
          R36OS_UNAME_R=4.4.189 R36OS_CMDLINE_FILE=/tmp/r50-cmdline R36OS_KERNEL_STATUS_OUT=/tmp/r50-status "$H"
          grep -Fxq 'active_kernel=4.4.189' /tmp/r50-status
          grep -Fxq 'active_kernel_track=Legacy' /tmp/r50-status
          grep -Fxq 'baseline_status=4.4.189 Legacy' /tmp/r50-status
          grep -Fxq 'last_k1_probe=consumed_readback_failed' /tmp/r50-status

          echo 'root=x r36os.kernel_slot=next r36os.k1_probe=payloads_loaded' >/tmp/r50-cmdline
          R36OS_UNAME_R=6.12.94-r36os-k1 R36OS_CMDLINE_FILE=/tmp/r50-cmdline R36OS_KERNEL_STATUS_OUT=/tmp/r50-status "$H"
          grep -Fxq 'active_kernel=6.12.94-r36os-k1' /tmp/r50-status
          grep -Fxq 'active_kernel_track=K1' /tmp/r50-status
          grep -Fxq 'baseline_status=6.12.94-r36os-k1 K1' /tmp/r50-status
          echo R50_KERNEL_STATUS_TEST=PASS

      - name: Verify core manifest entries
        run: |
          set -euo pipefail
          M=pkg/payload/root/etc/r36os-core-manifest.sha256
          for p in \
            /usr/local/bin/r36os-kernel-next-prepare \
            /usr/local/bin/r36os-kernel-slot \
            /usr/local/bin/r36os-r36update-maint \
            /usr/local/bin/r36os-kernel-next-health \
            /usr/local/bin/r36os-k1-install-hook \
            /usr/local/bin/r36os-running-kernel-status \
            /etc/systemd/system/r36os.service.d/97-running-kernel-status.conf \
            /opt/r36os/kernel-next/hooked-boot.ini \
            /opt/r36os/kernel-next/hook.conf; do
            exp="$(awk -v p="$p" '$2==p{print $1}' "$M")"
            got="$(sha256sum "pkg/payload/root$p" | awk '{print $1}')"
            test -n "$exp" && test "$exp" = "$got"
          done
          echo R50_CORE_MANIFEST=PASS

      - name: Upload exact validated R50 candidate
        uses: actions/upload-artifact@v4
        with:
          name: R36OS-Alpha5R50-audited-validation-candidate
          path: |
            out-a/00-R36OS-Alpha5R50-RootConsumedKernelStatus-FromR49.r36upd
            out-a/00-R36OS-Alpha5R50-RootConsumedKernelStatus-FromR49.r36upd.sha256
            out-a/latest.conf
            out-a/RELEASE_REPORT.txt
            r50-build-a.log
            r50-build-b.log
          if-no-files-found: error
          retention-days: 30
