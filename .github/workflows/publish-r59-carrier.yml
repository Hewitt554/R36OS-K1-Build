name: Publish R36OS Alpha 5R59 via verified carrier

on:
  push:
    branches:
      - work/r59-k1-rtl8188eu-wifi-2026-09-30
    paths:
      - '.github/workflows/publish-r59-carrier.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPO: Hewitt554/R36OS-K1-Build
      VALIDATION_RUN: '36775771043'
      VALIDATION_ARTIFACT_ID: '11125608257'
      VALIDATED_HEAD_SHA: fad9c4b70b4cf2351fa9ebb6696d712790622d10
      PREPUBLISH_MAIN_SHA: 39c64b87a2dd9cd9f323fb01db2fc450f9431244
      CARRIER_TAG: alpha5r48
      NAME: 00-R36OS-Alpha5R59-K1RTL8188EUWiFi-FromR58.r36upd
      EXPECTED_SHA: cfd4daa7185ec40fdb42bf7e62736e714f98d5fbd16e0a683085015beb48b624
      EXPECTED_SIZE: '179331714'
      EXPECTED_CID: 9d7bd2334f315d98b482f850
      EXPECTED_IMAGE_SHA: 6a7b7801e293b17af7ac014fba8f6be63372f5f853cbd18ad1ac404f4332a7fe
      EXPECTED_DTB_SHA: e2145905b1beb8d0f5b9dee6c5a21d31c29474be8762c893e81506fc40e627f4
      EXPECTED_UINITRD_SHA: 023a0d2adc113b2d1fea6826387ab6e03e4d479cf5fa36c9b9ff86cf41fd1925

    steps:
      - uses: actions/checkout@v4

      - name: Prove validation lineage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN="$(gh api "repos/$REPO/actions/runs/$VALIDATION_RUN")"
          test "$(printf '%s' "$RUN" | jq -r .status)" = completed
          test "$(printf '%s' "$RUN" | jq -r .conclusion)" = success
          test "$(printf '%s' "$RUN" | jq -r .head_sha)" = "$VALIDATED_HEAD_SHA"
          ART="$(gh api "repos/$REPO/actions/artifacts/$VALIDATION_ARTIFACT_ID")"
          test "$(printf '%s' "$ART" | jq -r .name)" = R36OS-Alpha5R59-audited-validation-candidate
          test "$(printf '%s' "$ART" | jq -r .expired)" = false
          echo R59_VALIDATION_LINEAGE=PASS

      - name: Download exact validated R59 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/actions/artifacts/$VALIDATION_ARTIFACT_ID/zip" >candidate.zip
          mkdir candidate
          unzip -q candidate.zip -d candidate
          PKG="$(find candidate -type f -name "$NAME" -print)"
          SHA_FILE="$(find candidate -type f -name "$NAME.sha256" -print)"
          LATEST="$(find candidate -type f -name latest.conf -print)"
          REPORT="$(find candidate -type f -name RELEASE_REPORT.txt -print)"
          for v in PKG SHA_FILE LATEST REPORT; do
            p="${!v}"
            test -n "$p" && test -f "$p"
            echo "$v=$p" >>"$GITHUB_ENV"
          done

          test "$(stat -c %s "$PKG")" = "$EXPECTED_SIZE"
          test "$(sha256sum "$PKG" | awk '{print $1}')" = "$EXPECTED_SHA"
          grep -Fxq "$EXPECTED_SHA  $NAME" "$SHA_FILE"

          grep -Fxq 'version=0.5.59.0' "$REPORT"
          grep -Fxq 'base_version=0.5.58.0' "$REPORT"
          grep -Fxq "candidate_id=$EXPECTED_CID" "$REPORT"
          grep -Fxq 'old_candidate_id=4c70486f70ba16acf7437403' "$REPORT"
          grep -Fxq "image_sha256=$EXPECTED_IMAGE_SHA" "$REPORT"
          grep -Fxq 'image_change=yes' "$REPORT"
          grep -Fxq "dtb_sha256=$EXPECTED_DTB_SHA" "$REPORT"
          grep -Fxq 'dtb_change=no' "$REPORT"
          grep -Fxq "uinitrd_sha256=$EXPECTED_UINITRD_SHA" "$REPORT"
          grep -Fxq 'uinitrd_change=no' "$REPORT"
          grep -Fxq 'modules_change=yes' "$REPORT"
          grep -Fxq 'wifi_driver=rtl8xxxu' "$REPORT"
          grep -Fxq 'wifi_usb_id=0bda:0179' "$REPORT"
          grep -Fxq 'module_payload_replace_safe=yes' "$REPORT"
          grep -Fxq 'native_ui_change=no' "$REPORT"
          grep -Fxq 'legacy_kernel_change=no' "$REPORT"

          rm -rf pkg
          mkdir pkg
          tar -xzf "$PKG" -C pkg
          (cd pkg && sha256sum -c checksums.sha256 >/dev/null)
          test "$(awk -F= '$1=="version"{print $2}' pkg/manifest.conf)" = 0.5.59.0
          test "$(awk -F= '$1=="base_version"{print $2}' pkg/manifest.conf)" = 0.5.58.0
          test "$(awk -F= '$1=="candidate_id"{print $2}' pkg/manifest.conf)" = "$EXPECTED_CID"
          test "$(awk -F= '$1=="k1_image_change"{print $2}' pkg/manifest.conf)" = yes
          test "$(awk -F= '$1=="k1_dtb_change"{print $2}' pkg/manifest.conf)" = no
          test "$(awk -F= '$1=="k1_uinitrd_change"{print $2}' pkg/manifest.conf)" = no
          test "$(awk -F= '$1=="module_payload_change"{print $2}' pkg/manifest.conf)" = yes
          test "$(awk -F= '$1=="wifi_driver"{print $2}' pkg/manifest.conf)" = rtl8xxxu
          test "$(awk -F= '$1=="wifi_usb_id"{print $2}' pkg/manifest.conf)" = 0bda:0179
          test "$(sha256sum pkg/payload/root/opt/r36os/kernel-next/K1/Image | awk '{print $1}')" = "$EXPECTED_IMAGE_SHA"
          test ! -e pkg/payload/root/opt/r36os/kernel-next/K1/uInitrd
          test ! -e pkg/payload/root/opt/r36os/kernel-next/K1/rk3326-r36s-k1.dtb
          test -s pkg/payload/root/opt/r36os/kernel-next/K1/modules.tar.xz
          test -s pkg/payload/root/lib/firmware/rtlwifi/rtl8188eufw.bin
          echo R59_VALIDATED_ARTIFACT=PASS

      - name: Upload exact R59 files to carrier release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$CARRIER_TAG" --repo "$REPO" >/dev/null
          cp "$REPORT" /tmp/R59_RELEASE_REPORT.txt

          ensure_asset() {
            local file="$1" name="$2"
            local rel id
            rel="$(gh api "repos/$REPO/releases/tags/$CARRIER_TAG")"
            id="$(printf '%s' "$rel" | jq -r --arg n "$name" '.assets[] | select(.name==$n) | .id' | head -1)"
            if [ -n "$id" ] && [ "$id" != null ]; then
              gh api -H 'Accept: application/octet-stream' "repos/$REPO/releases/assets/$id" >"/tmp/existing-$name"
              cmp "$file" "/tmp/existing-$name"
              echo "existing verified asset: $name"
            else
              gh release upload "$CARRIER_TAG" "$file" --repo "$REPO"
              echo "uploaded asset: $name"
            fi
          }

          ensure_asset "$PKG" "$NAME"
          ensure_asset "$SHA_FILE" "$NAME.sha256"
          ensure_asset /tmp/R59_RELEASE_REPORT.txt R59_RELEASE_REPORT.txt
          echo R59_CARRIER_UPLOAD=PASS

      - name: Verify published R59 package bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REL="$(gh api "repos/$REPO/releases/tags/$CARRIER_TAG")"
          ASSET_ID="$(printf '%s' "$REL" | jq -r --arg n "$NAME" '.assets[] | select(.name==$n) | .id')"
          SIZE="$(printf '%s' "$REL" | jq -r --arg n "$NAME" '.assets[] | select(.name==$n) | .size')"
          test -n "$ASSET_ID" && test "$ASSET_ID" != null
          test "$SIZE" = "$EXPECTED_SIZE"
          gh api -H 'Accept: application/octet-stream' "repos/$REPO/releases/assets/$ASSET_ID" >/tmp/r59.r36upd
          test "$(stat -c %s /tmp/r59.r36upd)" = "$EXPECTED_SIZE"
          test "$(sha256sum /tmp/r59.r36upd | awk '{print $1}')" = "$EXPECTED_SHA"
          echo R59_CARRIER_ASSET_VERIFY=PASS

      - name: Advance live channel R58 to R59
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$PREPUBLISH_MAIN_SHA"
          git checkout -B publish-r59-main origin/main
          cp "$LATEST" /tmp/r59-latest.conf
          grep -Fxq 'format=R36OS_REMOTE_UPDATE_V1' /tmp/r59-latest.conf
          grep -Fxq 'version=0.5.59.0' /tmp/r59-latest.conf
          grep -Fxq 'base_version=0.5.58.0' /tmp/r59-latest.conf
          grep -Fxq "filename=$NAME" /tmp/r59-latest.conf
          grep -Fxq "size_bytes=$EXPECTED_SIZE" /tmp/r59-latest.conf
          grep -Fxq "sha256=$EXPECTED_SHA" /tmp/r59-latest.conf
          grep -Fxq "candidate_id=$EXPECTED_CID" /tmp/r59-latest.conf
          grep -Fxq 'kernel_release=6.12.94-r36os-k1' /tmp/r59-latest.conf
          grep -Fxq "url=https://github.com/$REPO/releases/download/$CARRIER_TAG/$NAME" /tmp/r59-latest.conf

          cp /tmp/r59-latest.conf r36os-release-channel/latest.conf
          git config user.name 'R36OS Release Bot'
          git config user.email 'r36os-release-bot@users.noreply.github.com'
          git add r36os-release-channel/latest.conf
          git diff --cached --check
          git commit -m 'Publish Alpha 5R59 update channel via verified carrier asset'
          CHANNEL_COMMIT="$(git rev-parse HEAD)"
          echo "CHANNEL_COMMIT=$CHANNEL_COMMIT" >>"$GITHUB_ENV"
          git push origin HEAD:main
          echo R59_CHANNEL_ADVANCE=PASS

      - name: Verify live channel and preserve postpublish backup
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$CHANNEL_COMMIT"
          git show "$CHANNEL_COMMIT:r36os-release-channel/latest.conf" >/tmp/live.conf
          cmp /tmp/live.conf /tmp/r59-latest.conf
          git push origin "$CHANNEL_COMMIT:refs/heads/backup/r59-postpublish-verified-2026-09-30"
          echo R59_PUBLISH=PASS
