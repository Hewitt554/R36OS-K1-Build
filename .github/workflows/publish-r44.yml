name: Publish R36OS Alpha 5R44 exact validated artifact

on:
  push:
    branches:
      - work/r44-k1-fat-staging-2026-09-29
    paths:
      - '.github/workflows/publish-r44.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REPO: Hewitt554/R36OS-K1-Build
      VALIDATION_RUN: '36535389418'
      VALIDATION_ARTIFACT_ID: '11017294533'
      VALIDATED_SOURCE_SHA: b4feb6681c4ccb0f474075f94097761da0f26f75
      PREPUBLISH_MAIN_SHA: d4841bcbffd7a455c7554593bd03a560b4f77b93
      TAG: alpha5r44
      NAME: 00-R36OS-Alpha5R44-K1FATStaging-FromR43.r36upd
      EXPECTED_SHA: 2a6b872c3e7b81a88272c03f8c1484d9d4ae582dfe9172796ebff4e8e396a4fa
      EXPECTED_SIZE: '10819'

    steps:
      - uses: actions/checkout@v4

      - name: Prove validation run and download exact candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_JSON="$(gh api "repos/$REPO/actions/runs/$VALIDATION_RUN")"
          test "$(printf '%s' "$RUN_JSON" | jq -r .conclusion)" = success
          test "$(printf '%s' "$RUN_JSON" | jq -r .head_sha)" = "$VALIDATED_SOURCE_SHA"

          ART_JSON="$(gh api "repos/$REPO/actions/artifacts/$VALIDATION_ARTIFACT_ID")"
          test "$(printf '%s' "$ART_JSON" | jq -r .name)" = R36OS-Alpha5R44-audited-validation-candidate
          test "$(printf '%s' "$ART_JSON" | jq -r .expired)" = false

          gh api -H 'Accept: application/vnd.github+json'             "repos/$REPO/actions/artifacts/$VALIDATION_ARTIFACT_ID/zip" > candidate.zip
          rm -rf candidate
          mkdir candidate
          unzip -q candidate.zip -d candidate

          PKG="$(find candidate -type f -name "$NAME" -print)"
          SHA_FILE="$(find candidate -type f -name "$NAME.sha256" -print)"
          LATEST="$(find candidate -type f -name latest.conf -print)"
          REPORT="$(find candidate -type f -name RELEASE_REPORT.txt -print)"
          AUDIT="$(find candidate -type f -name R44_AUDIT.md -print)"
          test "$(printf '%s\n' "$PKG" | grep -c .)" -eq 1
          test "$(printf '%s\n' "$SHA_FILE" | grep -c .)" -eq 1
          test "$(printf '%s\n' "$LATEST" | grep -c .)" -eq 1
          test "$(printf '%s\n' "$REPORT" | grep -c .)" -eq 1
          test "$(printf '%s\n' "$AUDIT" | grep -c .)" -eq 1
          {
            echo "PKG=$PKG"
            echo "SHA_FILE=$SHA_FILE"
            echo "LATEST=$LATEST"
            echo "REPORT=$REPORT"
            echo "AUDIT=$AUDIT"
          } >> "$GITHUB_ENV"

      - name: Audit exact downloaded R44 candidate
        run: |
          set -euo pipefail
          test "$(stat -c %s "$PKG")" = "$EXPECTED_SIZE"
          test "$(sha256sum "$PKG" | awk '{print $1}')" = "$EXPECTED_SHA"
          grep -Fxq "$EXPECTED_SHA  $NAME" "$SHA_FILE"

          test "$(awk -F= '$1=="version"{print $2}' "$LATEST")" = 0.5.44.0
          test "$(awk -F= '$1=="base_version"{print $2}' "$LATEST")" = 0.5.43.0
          test "$(awk -F= '$1=="filename"{print $2}' "$LATEST")" = "$NAME"
          test "$(awk -F= '$1=="size_bytes"{print $2}' "$LATEST")" = "$EXPECTED_SIZE"
          test "$(awk -F= '$1=="sha256"{print $2}' "$LATEST")" = "$EXPECTED_SHA"
          test "$(awk -F= '$1=="url"{print $2}' "$LATEST")" = "https://github.com/$REPO/releases/download/$TAG/$NAME"
          grep -Fxq 'candidate_id=e551eb6598d6da7a8e8320e9' "$LATEST"
          grep -Fxq 'kernel_release=6.12.94-r36os-k1' "$LATEST"

          grep -Fxq 'base_version=0.5.43.0' "$REPORT"
          grep -Fxq 'version=0.5.44.0' "$REPORT"
          grep -Fxq 'k1_binary_change=no' "$REPORT"
          grep -Fxq "size_bytes=$EXPECTED_SIZE" "$REPORT"
          grep -Fxq "sha256=$EXPECTED_SHA" "$REPORT"

          rm -rf package-audit
          mkdir package-audit
          tar -xzf "$PKG" -C package-audit
          (cd package-audit && sha256sum -c checksums.sha256 >/dev/null)
          test "$(awk -F= '$1=="version"{print $2}' package-audit/manifest.conf)" = 0.5.44.0
          test "$(awk -F= '$1=="base_version"{print $2}' package-audit/manifest.conf)" = 0.5.43.0
          test "$(awk -F= '$1=="k1_binary_change"{print $2}' package-audit/manifest.conf)" = no
          test ! -e package-audit/payload/root/etc/r36os/r36update-repair-once.conf
          test ! -e package-audit/payload/root/r36state
          ! find package-audit/payload/root -type f | grep -Eq '/(boot/|lib/modules/|usr/lib/modules/)'
          ! find package-audit/payload/root -type f | grep -Eq '/opt/r36os/kernel-next/K1/(Image|uInitrd|rk3326-r36s-k1.dtb|modules.tar.xz)$'
          ! grep -R -n -E 'github_pat_[A-Za-z0-9]|gh[pousr]_[A-Za-z0-9]' package-audit/payload/root
          echo R44_PREPUBLISH_AUDIT=PASS

      - name: Create prerelease and upload exact validated assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "tag $TAG already exists; refusing duplicate publication" >&2
            exit 30
          fi

          cat > /tmp/release-notes.txt <<'EOF'
          R36OS Alpha 5R44

          Narrow K1 Boot Next Once staging compatibility update for Alpha 5R43.

          - Fixes physical error code 33 / stage-copy on R36UPDATE FAT.
          - Replaces cp -a metadata-preserving staging with FAT-safe data staging.
          - Verifies the complete staged file tree, K1 manifest and preflight before activation.
          - Cleans only candidate-bound stale staging directories.
          - Preserves the existing low-space fail-closed check.
          - Does not re-run the R43 FAT repair.
          - K1 Image, DTB, uInitrd and modules are unchanged.
          - Private GitHub diagnostics configuration/credential is untouched.
          EOF

          gh release create "$TAG"             --repo "$REPO"             --target "$VALIDATED_SOURCE_SHA"             --title 'R36OS Alpha 5R44 — K1 FAT staging fix'             --notes-file /tmp/release-notes.txt             --prerelease

          gh release upload "$TAG" "$PKG" "$SHA_FILE" "$REPORT" "$AUDIT" --repo "$REPO"

      - name: Verify published asset before exposing update channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REL="$(gh api "repos/$REPO/releases/tags/$TAG")"
          test "$(printf '%s' "$REL" | jq -r .prerelease)" = true
          test "$(printf '%s' "$REL" | jq -r .target_commitish)" = "$VALIDATED_SOURCE_SHA"
          ASSET_ID="$(printf '%s' "$REL" | jq -r --arg n "$NAME" '.assets[] | select(.name==$n) | .id')"
          PUB_SIZE="$(printf '%s' "$REL" | jq -r --arg n "$NAME" '.assets[] | select(.name==$n) | .size')"
          test -n "$ASSET_ID"
          test "$PUB_SIZE" = "$EXPECTED_SIZE"
          gh api -H 'Accept: application/octet-stream' "repos/$REPO/releases/assets/$ASSET_ID" > /tmp/published.r36upd
          test "$(stat -c %s /tmp/published.r36upd)" = "$EXPECTED_SIZE"
          test "$(sha256sum /tmp/published.r36upd | awk '{print $1}')" = "$EXPECTED_SHA"
          echo R44_PUBLISHED_ASSET_VERIFY=PASS

      - name: Advance public update channel from exact R43 state
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT="$(git rev-parse origin/main)"
          test "$CURRENT" = "$PREPUBLISH_MAIN_SHA" || {
            echo "main moved: expected $PREPUBLISH_MAIN_SHA got $CURRENT" >&2
            exit 40
          }

          git checkout -B publish-r44-main origin/main
          mkdir -p r36os-release-channel
          cp "$LATEST" r36os-release-channel/latest.conf
          git config user.name 'R36OS Release Bot'
          git config user.email 'r36os-release-bot@users.noreply.github.com'
          git add r36os-release-channel/latest.conf
          git diff --cached --check
          git commit -m 'Publish Alpha 5R44 update channel'
          CHANNEL_COMMIT="$(git rev-parse HEAD)"
          echo "CHANNEL_COMMIT=$CHANNEL_COMMIT" >> "$GITHUB_ENV"
          git push origin HEAD:main

      - name: Verify channel and preserve publish evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$CHANNEL_COMMIT"
          git show "$CHANNEL_COMMIT:r36os-release-channel/latest.conf" > /tmp/live-latest.conf
          cmp /tmp/live-latest.conf "$LATEST"

          cat > /tmp/PUBLISH_EVIDENCE.txt <<EOF
          R36OS Alpha 5R44 publish evidence
          validation_run=$VALIDATION_RUN
          validation_artifact_id=$VALIDATION_ARTIFACT_ID
          validated_source_sha=$VALIDATED_SOURCE_SHA
          prepublish_main_sha=$PREPUBLISH_MAIN_SHA
          channel_commit=$CHANNEL_COMMIT
          tag=$TAG
          package=$NAME
          size_bytes=$EXPECTED_SIZE
          sha256=$EXPECTED_SHA
          exact_validated_artifact=yes
          rebuilt_at_publish=no
          EOF

          gh release upload "$TAG" /tmp/PUBLISH_EVIDENCE.txt --repo "$REPO"
          git push origin "$CHANNEL_COMMIT:refs/heads/backup/r44-postpublish-verified-2026-09-29"
          echo R44_PUBLISH=PASS
