odroidgoa-uboot-config
# R36OS Alpha6 CP26 RAM-ONLY K1 FIRST-BOOT DIAGNOSTIC - UNTESTED
# No persistent environment commands or filesystem changes requested.
# No automatic rollback: restore boot.ini on Windows if boot fails.
setenv loadaddr "0x02000000"
setenv initrd_loadaddr "0x01100000"
setenv dtb_loadaddr "0x01f00000"
if load mmc 1:1 ${loadaddr} "R36OS/CP26/Image"
then
  if load mmc 1:1 ${initrd_loadaddr} "R36OS/CP26/diag.uInitrd"
  then
    if load mmc 1:1 ${dtb_loadaddr} "R36OS/CP26/rk3326-r36s-k1.dtb"
    then
      setenv bootargs "console=tty0 console=/dev/ttyFIQ0 consoleblank=0 fbcon=rotate:0 rdinit=/init r36os.diag=cp26 r36os.boot_mode=diagnostic"
      echo R36OS_CP26_DIAGNOSTIC_START
      booti ${loadaddr} ${initrd_loadaddr} ${dtb_loadaddr}
    fi
  fi
fi
echo R36OS_CP26_DIAGNOSTIC_FAILED_OR_RETURNED
sleep 15
reset